<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Farmacompanha — Acompanhamento Farmacoterapêutico | Método Dáder</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg transform='rotate(-45 16 14.5)'%3E%3Crect x='12.75' y='7' width='6.5' height='15' rx='3.25' fill='%23fff' fill-opacity='.42'/%3E%3Cpath d='M12.75 14.5V10.25a3.25 3.25 0 0 1 6.5 0V14.5z' fill='%23fff'/%3E%3C/g%3E%3Cpath d='M7 19.5c2.6 6.4 15.4 6.4 18 0' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='19.5' r='1.9' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a14; --panel:#13131f; --panel2:#1a1a28; --border:#262638;
    --text:#e6e6f0; --muted:#8888a0; --primary:#7c3aed; --cyan:#06b6d4;
    --red:#dc2626; --orange:#f97316; --yellow:#eab308; --slate:#64748b;
    --emerald:#10b981; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  textarea{min-height:80px;resize:vertical;font-family:inherit}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
  /* Layout */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(10,10,20,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:24px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand .logo{width:28px;height:28px;flex-shrink:0;display:block}
  .wm{letter-spacing:-.01em}
  .wm span{font-weight:500;opacity:.78}
  .nav{display:flex;gap:4px}
  .nav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px}
  .nav a.active,.nav a:hover{color:var(--text);background:var(--panel)}
  .nav a.active{color:var(--primary)}
  .topbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .container{max-width:1280px;margin:0 auto;padding:32px 24px}
  .container.wide{max-width:1600px}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:500;font-size:13px;transition:all .15s;text-decoration:none}
  .btn:hover{background:var(--panel2);border-color:#33334a}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#6d28d9;border-color:#6d28d9}
  .btn.gradient{background:linear-gradient(90deg,var(--primary),var(--cyan));border:0;color:#fff;font-weight:600}
  .btn.gradient:hover{filter:brightness(1.1)}
  .btn.lg{padding:12px 22px;font-size:14px}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.ghost{background:transparent;border:0}
  .btn.outline{background:transparent}
  .btn.danger{color:var(--red)}
  .btn.danger:hover{background:rgba(220,38,38,.1)}
  /* Cards */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .card-h{padding:18px 20px 12px;border-bottom:1px solid var(--border)}
  .card-t{font-weight:600;font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
  .card-d{font-size:13px;color:var(--muted);margin:0}
  .card-c{padding:18px 20px}
  .card-f{padding:14px 20px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
  /* Hero */
  .hero{position:relative;border-radius:18px;border:1px solid var(--border);background:var(--panel);padding:42px;overflow:hidden;margin-bottom:32px}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(at top left,rgba(124,58,237,.15),transparent 50%),radial-gradient(at bottom right,rgba(6,182,212,.12),transparent 50%);pointer-events:none}
  .hero .inner{position:relative;max-width:780px}
  .hero .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel2);border-radius:8px;font-size:12px;font-weight:500;margin-bottom:16px}
  .hero .pill .star{color:var(--primary)}
  .hero h1{font-size:38px;font-weight:700;margin:0 0 14px;letter-spacing:-.02em;line-height:1.1}
  .hero p{font-size:16px;color:var(--muted);line-height:1.65;margin:0 0 24px}
  .hero .actions{display:flex;flex-wrap:wrap;gap:12px}
  /* Grid */
  .grid{display:grid;gap:16px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-5{grid-template-columns:repeat(5,1fr)}
  .grid-12{grid-template-columns:repeat(12,1fr)}
  @media(max-width:900px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr}.grid-12{grid-template-columns:1fr}}
  .col-2{grid-column:span 2}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
  /* Badge */
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--panel2);color:var(--muted);text-transform:capitalize;line-height:1.4}
  .badge.outline{background:transparent}
  .badge.red{background:rgba(220,38,38,.12);color:#fca5a5;border-color:rgba(220,38,38,.4)}
  .badge.orange{background:rgba(249,115,22,.12);color:#fdba74;border-color:rgba(249,115,22,.4)}
  .badge.yellow{background:rgba(234,179,8,.12);color:#fde047;border-color:rgba(234,179,8,.4)}
  .badge.cyan{background:rgba(6,182,212,.12);color:#67e8f9;border-color:rgba(6,182,212,.4)}
  .badge.slate{background:rgba(100,116,139,.15);color:#cbd5e1;border-color:rgba(100,116,139,.4)}
  .badge.emerald{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.4)}
  .badge.purple{background:rgba(124,58,237,.15);color:#c4b5fd;border-color:rgba(124,58,237,.4)}
  .badge.amber{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.4)}
  /* Section heads */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .sec-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  hr.sep{border:0;border-top:1px solid var(--border);margin:18px 0}
  /* Empty state */
  .empty{border:1.5px dashed var(--border);background:rgba(255,255,255,.02);border-radius:14px;padding:48px;text-align:center;color:var(--muted)}
  .empty .icon{width:54px;height:54px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:24px}
  .empty h3{color:var(--text);margin:0 0 6px;font-size:16px}
  /* Wizard layout */
  .wizard{display:flex;min-height:calc(100vh - 60px)}
  .wizard aside{width:280px;border-right:1px solid var(--border);background:var(--panel);padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column}
  .wizard aside .head{display:flex;align-items:center;gap:8px;font-weight:600;padding:0 8px 12px}
  .wizard aside nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .wizard aside nav .grp{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:14px 12px 4px}
  .wizard aside nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);text-align:left;width:100%;font-size:13px}
  .wizard aside nav button:hover{background:var(--panel2);color:var(--text)}
  .wizard aside nav button.active{background:rgba(124,58,237,.12);color:var(--primary);font-weight:500}
  .wizard aside nav button .ico{width:26px;height:26px;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:700}
  .wizard aside nav button.active .ico{background:var(--primary);color:#fff}
  .wizard aside nav button .check{margin-left:auto;color:var(--primary);font-size:11px}
  .wizard aside .foot{padding:14px 8px 0;border-top:1px solid var(--border);font-size:11px;color:var(--muted);margin-top:14px}
  .wizard main{flex:1;background:rgba(0,0,0,.15)}
  .wizard .progress{height:4px;background:var(--panel2)}
  .wizard .progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .4s}
  .wizard .step-content{max-width:1180px;margin:0 auto;padding:32px}
  .wizard .step-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .wizard .step-head h1{margin:0;font-size:24px;letter-spacing:-.01em}
  .wizard .step-help{color:var(--muted);font-size:13px;margin:0 0 24px;max-width:760px;line-height:1.6}
  .wizard .step-nav{margin-top:36px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
  /* Checkbox/Radio */
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
  .chk input{width:16px;height:16px;accent-color:var(--primary);margin:0;flex-shrink:0}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
  .seg button{padding:5px 12px;border:0;background:transparent;color:var(--muted);border-radius:6px;font-size:12px;font-weight:600}
  .seg button.on{background:var(--primary);color:#fff}
  .seg.danger button.on{background:var(--red)}
  .seg.warn button.on{background:var(--amber);color:#422006}
  /* Slider number field (entrada rápida de medidas) */
  .numf .numf-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .numf .numf-top label{margin:0}
  .numf .numf-val{font-weight:700;color:var(--primary);font-size:16px;white-space:nowrap}
  .numf .numf-val.empty{color:var(--muted);font-weight:500}
  .numf .numf-val .u{font-weight:500;color:var(--muted);font-size:11px;margin-left:2px}
  .numf .numf-row{display:flex;align-items:center;gap:10px}
  .numf input[type=range]{flex:1;min-width:0;height:6px;padding:0;margin:0;background:transparent;border:0;accent-color:var(--primary);cursor:pointer}
  .numf input.numf-num{width:76px;flex-shrink:0;text-align:center;padding:6px 4px}
  /* Cards de escore calculado (CHA₂DS₂-VASc / HAS-BLED) */
  .score-card{border:1px solid var(--border);border-radius:12px;background:var(--panel2);padding:16px}
  .score-card .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .score-card .sc-num{font-size:34px;font-weight:700;line-height:1;color:var(--text);white-space:nowrap}
  .score-card .sc-num span{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
  .score-card .sc-level{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .score-card .sc-list{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--border)}
  .score-card .sc-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
  .score-card .sc-row:last-child{border-bottom:0}
  .score-card .sc-row.on{color:var(--text)}
  .score-card .sc-ck{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
  .score-card .sc-row.on .sc-ck{background:var(--primary);border-color:var(--primary)}
  .score-card .sc-in{width:16px;height:16px;margin:0;padding:0;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
  .score-card .sc-in:disabled{cursor:default}
  .score-card .sc-t{flex:1}
  .score-card .sc-t em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
  .score-card .sc-p{font-size:12px;font-weight:600;color:var(--muted)}
  .score-card .sc-row.on .sc-p{color:var(--primary)}
  .numf .numf-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px;padding:0 2px}
  /* Tables */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  .tbl th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel2)}
  .tbl tr:hover td{background:rgba(255,255,255,.02)}
  .tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
  /* Alert */
  .alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-size:13px}
  .alert.warn{background:rgba(234,179,8,.08);border-color:rgba(234,179,8,.3);color:#fde047}
  .alert.info{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.3);color:#67e8f9}
  .alert.danger{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.3);color:#fca5a5}
  .alert.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#6ee7b7}
  .alert .t{font-weight:600;margin-bottom:2px}
  /* Matrix */
  .matrix{overflow-x:auto;padding-bottom:16px}
  .matrix table{border-collapse:separate;border-spacing:0;width:100%}
  .matrix th{padding:12px;text-align:center;border-bottom:2px solid var(--border);font-weight:600;font-size:12px;min-width:130px}
  .matrix th:first-child{text-align:left;min-width:220px;position:sticky;left:0;background:var(--bg);z-index:5}
  .matrix td{padding:6px;text-align:center;border-bottom:1px solid var(--border)}
  .matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:5;padding:10px 12px}
  .matrix td:first-child .nm{font-weight:500}
  .matrix td:first-child .cl{font-size:11px;color:var(--muted)}
  .matrix .cell{padding:14px 6px;border-radius:8px;font-weight:700;font-size:12px;cursor:default;transition:transform .15s;position:relative}
  .matrix .cell:hover{transform:scale(1.05);z-index:6}
  .matrix .cell.contraindicado{background:#dc2626;color:#fff}
  .matrix .cell.grave{background:#f97316;color:#fff}
  .matrix .cell.moderado{background:#eab308;color:#422006}
  .matrix .cell.leve{background:#06b6d4;color:#fff}
  .matrix .cell.minimo{background:#334155;color:#cbd5e1}
  .matrix .legend{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:20px}
  .matrix .legend .item{display:flex;align-items:center;gap:8px;font-size:13px}
  .matrix .legend .swatch{width:18px;height:18px;border-radius:5px}
  /* Tooltip */
  .tip{position:relative}
  .tip .tip-content{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:300px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;color:var(--text);font-weight:400;font-size:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .tip:hover .tip-content{display:block}
  .tip .tip-content .h{font-weight:700;font-size:13px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .tip .tip-content .h .sev{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
  .tip .tip-content .rec{margin-top:8px;background:var(--panel2);padding:8px;border-radius:6px;border-left:2px solid var(--primary);font-weight:500}
  /* Severity card on Step5 */
  .sev-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
  .sev-summary .sc{padding:16px;border-radius:12px;border:1px solid var(--border);text-align:center}
  .sev-summary .sc .n{font-size:28px;font-weight:700;line-height:1}
  .sev-summary .sc .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:6px;opacity:.85}
  .sev-summary .sc.contraindicado{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.4);color:#fca5a5}
  .sev-summary .sc.grave{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#fdba74}
  .sev-summary .sc.moderado{background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.4);color:#fde047}
  .sev-summary .sc.leve{background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.4);color:#67e8f9}
  .sev-summary .sc.minimo{background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.4);color:#cbd5e1}
  .sev-summary .sc.zero{opacity:.4}
  /* Interaction card */
  .int-card{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:14px}
  .int-card.contraindicado{border-left-color:var(--red)}
  .int-card.grave{border-left-color:var(--orange)}
  .int-card.moderado{border-left-color:var(--yellow)}
  .int-card.leve{border-left-color:var(--cyan)}
  .int-card.minimo{border-left-color:var(--slate)}
  .int-card .h{padding:14px 18px;background:rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:start;gap:14px;border-bottom:1px solid var(--border)}
  .int-card .h .t{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
  .int-card .h .t .lk{color:var(--muted);font-weight:400;font-size:14px;margin:0 8px}
  .int-card .h .d{color:var(--muted);font-size:12px;margin-top:2px}
  .int-card .b{padding:18px}
  .int-card .b .row{margin-bottom:14px}
  .int-card .b h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:600}
  .int-card .b p{margin:0;font-size:13px;line-height:1.55}
  .int-card .b .reco{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);border-radius:10px;padding:14px;margin-top:14px}
  .int-card .b .reco h5{color:var(--primary)}
  /* Med list (step 3) - Dáder card */
  .item-card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
  .item-card .rm{position:absolute;right:10px;top:10px}
  .item-card .item-head{font-weight:600;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .item-card .sub-h{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.06em;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .meta-pills{display:flex;flex-wrap:wrap;gap:6px;background:rgba(0,0,0,.15);padding:8px 10px;border-radius:8px;font-size:12px;align-items:center;margin-top:10px}
  .meta-pills .lbl{font-weight:600;color:var(--muted);margin-right:4px}
  .add-btn{display:block;width:100%;padding:12px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);border-radius:10px;font-weight:500;text-align:center;transition:all .15s}
  .add-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(124,58,237,.05)}
  /* Hover card on assess card */
  .ass-card{transition:border-color .15s}
  .ass-card:hover{border-color:var(--primary)}
  /* Search */
  .search-wrap{position:relative;max-width:420px}
  .search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* =====================================================================
   INTERACTION ENGINE
   ===================================================================== */
const INHIBITION_W = { forte:3, moderado:2, fraco:1, desprezivel:0 };
const ROLE_W = { principal:2, secundario:1 };
const SEV_LABEL = { contraindicado:"Contraindicado", grave:"Grave", moderado:"Moderado", leve:"Leve", minimo:"Mínimo" };
const SEV_ORDER = ["contraindicado","grave","moderado","leve","minimo"];

function severityFromScore(score, flags){
  let s = score;
  if (flags.prodrugFailure) s += 2;
  if (flags.narrowTI) s += 1;
  if (flags.qtRisk) s += 1;
  if (s>=7) return "contraindicado";
  if (s>=5) return "grave";
  if (s>=3) return "moderado";
  if (s>=1) return "leve";
  return "minimo";
}

function evaluateInteraction(ssri, cv){
  const isoformsHit = [];
  let score = 0;
  Object.keys(cv.substrate).forEach(iso=>{
    const role = cv.substrate[iso]; if(!role) return;
    const inhibition = ssri.inhibition[iso]; if(!inhibition) return;
    if (inhibition === "desprezivel") return;
    isoformsHit.push({ isoform: iso, inhibition, role });
    score += INHIBITION_W[inhibition] * ROLE_W[role];
  });
  const flags = {
    qtRisk: !!cv.qtRisk,
    narrowTI: !!cv.narrowTI,
    prodrugFailure: !!cv.isProdrug && isoformsHit.some(h=>h.role==="principal" && (h.inhibition==="forte"||h.inhibition==="moderado")),
  };
  const severity = (isoformsHit.length===0 && !flags.qtRisk) ? "minimo" : severityFromScore(score, flags);
  const mechParts = isoformsHit.map(h=>`inibição ${h.inhibition} de ${h.isoform} (substrato ${h.role})`);
  let mechanism = mechParts.length>0
    ? `${ssri.name} promove ${mechParts.join(" e ")} de ${cv.name}.`
    : `Sem inibição relevante das isoformas envolvidas no metabolismo de ${cv.name} por ${ssri.name}.`;
  if (flags.prodrugFailure){
    mechanism += ` Atenção: ${cv.name} é pró-fármaco — a inibição reduz a formação do metabólito ativo, podendo causar FALHA TERAPÊUTICA.`;
  }
  let clinicalImpact = cv.notes;
  if (flags.qtRisk) clinicalImpact += " Risco aditivo de prolongamento de QT.";
  let recommendation = "";
  switch(severity){
    case "contraindicado": recommendation="Evitar a combinação. Substituir o ISRS por sertralina, citalopram ou escitalopram (perfil enzimático mais limpo), conforme contexto clínico."; break;
    case "grave": recommendation="Considerar substituição do ISRS ou ajuste de dose do fármaco cardiovascular. Monitoramento clínico/laboratorial intensivo."; break;
    case "moderado": recommendation="Iniciar com dose mínima eficaz, monitorar resposta e eventos adversos. Reavaliar periodicamente."; break;
    case "leve": recommendation="Manter associação com observação clínica. Orientar paciente sobre sinais de alerta."; break;
    case "minimo": recommendation="Sem necessidade de ajuste específico. Manter farmacovigilância de rotina."; break;
  }
  if (cv.isProdrug && flags.prodrugFailure && severity!=="minimo"){
    recommendation += " Para clopidogrel especificamente: preferir sertralina ou escitalopram, ou considerar troca por prasugrel/ticagrelor (decisão cardiológica).";
  }
  return {
    ssriId: ssri.id, ssriName: ssri.name, cvId: cv.id, cvName: cv.name, cvClass: cv.classLabel,
    isoforms: isoformsHit, severity,
    severityScore: Math.min(10, score + (flags.prodrugFailure?2:0) + (flags.narrowTI?1:0) + (flags.qtRisk?1:0)),
    mechanism, clinicalImpact, recommendation, flags,
  };
}

function evaluateAll(ssris, cvDrugs){
  const out = [];
  for (const s of ssris) for (const c of cvDrugs) out.push(evaluateInteraction(s,c));
  return out;
}

function migrate(a){
  const e = emptyAssessment();
  /* deep-merge defaults onto a */
  function merge(dst, src){
    Object.keys(src).forEach(k=>{
      if (dst[k]===undefined || dst[k]===null) dst[k] = src[k];
      else if (typeof src[k]==='object' && !Array.isArray(src[k]) && typeof dst[k]==='object' && !Array.isArray(dst[k])) merge(dst[k], src[k]);
    });
    return dst;
  }
  const m = merge({...a}, e);
  /* migrate medications: add Dáder fields */
  m.medications = (m.medications||[]).map(med=>({
    id:med.id||uuid(), type:med.type||"other", drugId:med.drugId||"",
    name:med.name||"", dose:med.dose||"", frequency:med.frequency||"", route:med.route||"VO", indication:med.indication||"",
    stillUsing: med.stillUsing!==false, prescriber: med.prescriber||"",
    patientUnderstanding: med.patientUnderstanding||"", improving: med.improving||"",
    sinceDate: med.sinceDate||"", posology: med.posology||(med.dose?med.frequency:""),
    howTaken: med.howTaken||"", untilWhen: med.untilWhen||"",
    difficulty: med.difficulty||"", adverse: med.adverse||"",
    adherence: med.adherence||"", knowledge: med.knowledge||"",
    linkedProblemIds: med.linkedProblemIds||[]
  }));
  m.healthProblems = (m.healthProblems||[]).map(p=>({
    id:p.id||uuid(), name:p.name||"", startDate:p.startDate||"",
    controlled:p.controlled||"", concern:p.concern||"", notes:p.notes||""
  }));
  m.prms = (m.prms||[]).map(p=>({
    id:p.id||uuid(), relatedMedId:p.relatedMedId||"", relatedProblemId:p.relatedProblemId||"",
    needs:p.needs||"", effective:p.effective||"", effectiveQuant:!!p.effectiveQuant,
    safe:p.safe||"", safeQuant:!!p.safeQuant, classification:p.classification||0, description:p.description||""
  }));
  m.followUpVisits = (m.followUpVisits||[]).map(v=>({
    id:v.id||uuid(), date:v.date||"", notes:v.notes||"", changes:v.changes||""
  }));
  return m;
}

function getAssessments(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY)||"[]");
    return raw.map(migrate);
  }catch(e){ return []; }

function saveAssessment(a){
  const all = getAssessments();
  const i = all.findIndex(x=>x.id===a.id);
  const u = { ...a, updatedAt: new Date().toISOString() };
  if (i>=0) all[i]=u; else all.push(u);
  localStorage.setItem(KEY, JSON.stringify(all));
  return u;
}

/* =====================================================================
   GRANADA PRM CLASSIFIER
   ===================================================================== */
/* Returns 1-6 or 0 if no PRM identified
   1 = Necessidade — paciente sofre PS por não usar medicamento que necessita
   2 = Necessidade — paciente sofre PS por usar medicamento desnecessário
   3 = Efetividade não quantitativa
   4 = Efetividade quantitativa
   5 = Segurança não quantitativa
   6 = Segurança quantitativa
*/
function classifyPRM(p){
  if (p.needs==="N") return 2;
  if (p.effective==="N") return p.effectiveQuant ? 4 : 3;
  if (p.safe==="N") return p.safeQuant ? 6 : 5;
  return 0;
}

function imc(w,h){ if(!w||!h) return 0; return +(w / Math.pow(h/100,2)).toFixed(1); }
function imcLabel(v){ if(!v) return ""; if(v<18.5) return "Baixo peso"; if(v<25) return "Eutrófico"; if(v<30) return "Sobrepeso"; if(v<35) return "Obesidade I"; if(v<40) return "Obesidade II"; return "Obesidade III"; }
/* Inline help icon with hover tooltip — para orientar o profissional sobre cada indicador */
function infoTip(title, body){
  return `<span class="tip" style="cursor:help;margin-left:5px;font-weight:400"><span style="display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:10px;font-style:italic;font-weight:700;align-items:center;justify-content:center;vertical-align:middle">i</span><span class="tip-content"><span class="h">${title}</span>${body}</span></span>`;
}
/* Formata a titulação acadêmica do farmacêutico para relatório/carta */
function pharmacistTitles(sv){
  if(!sv) return "";
  const parts = [];
  if (sv.specialization) parts.push('Especialista em '+sv.specialization);
  if (sv.masters) parts.push('Mestre em '+sv.masters);
  if (sv.doctorate) parts.push('Doutor(a) em '+sv.doctorate);
  return parts.join(' · ');
}

function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* =====================================================================
   ASSESSMENT WIZARD (DÁDER — 9 STEPS)
   ===================================================================== */
let wizardState = { step:1, data:null, savedAt:null };

const STEPS = [
  { id:1, t:"Oferta & Cadastro",   ico:"1", grp:"Levantamento" },
  { id:2, t:"Preocupações & PS",   ico:"2", grp:"Levantamento" },
  { id:3, t:"Sacola de Medicamentos", ico:"3", grp:"Levantamento" },
  { id:4, t:"Revisão por Sistemas",ico:"4", grp:"Levantamento" },
  { id:5, t:"Estado de Situação",  ico:"5", grp:"Análise" },
  { id:6, t:"Fase de Estudo",      ico:"6", grp:"Análise" },
  { id:7, t:"Avaliação PRM",       ico:"7", grp:"Análise" },
  { id:8, t:"Plano de Intervenção",ico:"8", grp:"Ação" },
  { id:9, t:"Resultados & Seguimento", ico:"9", grp:"Ação" },
];

function renderAssessment(id){
  if (id === "new"){
    const d = emptyAssessment();
    saveAssessment(d);
    location.hash = `#/avaliacao/${d.id}`;
    return;
  }
  const data = getAssessment(id);
  if (!data){ location.hash = "#/"; return; }
  wizardState.data = data;
  if (!wizardState.step) wizardState.step = 1;
  drawWizard();
}

function persist(){
  syncScores(wizardState.data);
  wizardState.data = saveAssessment(wizardState.data);
  wizardState.savedAt = new Date();
}

function drawWizard(){
  const d = wizardState.data, step = wizardState.step;
  const groups = ["Levantamento","Análise","Ação"];
  let navHtml = "";
  groups.forEach(g=>{
    navHtml += `<div class="grp">${g}</div>`;
    STEPS.filter(s=>s.grp===g).forEach(s=>{
      navHtml += `<button class="${step===s.id?'active':''}" onclick="goStep(${s.id})">
        <span class="ico">${s.ico}</span>${s.t}
        ${step>s.id?'<span class="check">✓</span>':''}
      </button>`;
    });
  });
  $app.innerHTML = `
    ${topbar('home')}
    <div class="wizard">
      <aside>
        <div class="head">⚡ Avaliação Dáder</div>
        <nav>${navHtml}</nav>
        <div class="foot">${wizardState.savedAt?'Salvo às '+wizardState.savedAt.toLocaleTimeString('pt-BR'):'Auto-save ativo'}<br>Ctrl+S para salvar</div>
      </aside>
      <main>
        <div class="progress"><div class="progress-bar" style="width:${(step/9)*100}%"></div></div>
        <div class="step-content">
          <div class="step-head">
            <h1>Etapa ${step} — ${STEPS.find(s=>s.id===step).t}</h1>
            <div style="display:flex;gap:8px">
              <button class="btn outline sm" onclick="window.open('#/relatorio/${d.id}','_blank')">📄 Pré-visualizar Relatório</button>
            </div>
          </div>
          <p class="step-help" id="stepHelp"></p>
          <div id="stepBody"></div>
          <div class="step-nav">
            <button class="btn" onclick="goStep(${step-1})" ${step===1?'disabled style="opacity:.4"':''}>← Voltar</button>
            ${step<9
              ? `<button class="btn primary" onclick="goStep(${step+1})">Próximo →</button>`
              : `<button class="btn gradient" onclick="window.open('#/relatorio/${d.id}','_blank')">Finalizar e Gerar Relatório 📄</button>`}
          </div>
        </div>
      </main>
    </div>`;
  drawStep(step);
}

window.goStep = function(s){
  s = Math.max(1, Math.min(9, s));
  wizardState.step = s;
  drawWizard();
};

const STEP_HELP = {
  1:"Registre os dados do paciente, o motivo que o levou à farmácia e formalize o aceite do serviço de seguimento farmacoterapêutico. Este é o primeiro contato.",
  2:"Liste, com as próprias palavras do paciente, os problemas de saúde que mais o preocupam. Classifique se cada um está controlado e o nível de preocupação (Muito / Razoável / Pouco).",
  3:"Sacola de medicamentos: para cada medicamento em uso, responda às 10 perguntas do Método Dáder. Avalie adesão e conhecimento do paciente sobre o medicamento.",
  4:"Revisão sistemática (cabeça aos pés): registre achados por sistema corporal, parâmetros quantitativos com data, hábitos de vida, vacinação e alergias.",
  5:"Estado de Situação — a 'foto' do paciente. Veja a correspondência entre problemas de saúde e medicamentos. Vincule cada medicamento ao problema que ele trata.",
  6:"Fase de Estudo: apoio à decisão. O sistema apresenta automaticamente as informações farmacológicas relevantes (CYP, indicações, interações) para suportar sua avaliação.",
  7:"Avaliação de PRM (Consenso de Granada): para cada medicamento responda Necessidade / Efetividade / Segurança. A classificação PRM 1-6 é gerada automaticamente.",
  8:"Plano de Intervenção: defina objetivos, prioridades e o tipo de intervenção. Gere automaticamente o relatório multiprofissional (editável).",
  9:"Registre os desfechos das intervenções e adicione visitas sucessivas para acompanhamento longitudinal."
};

function drawStep(step){
  const d = wizardState.data;
  document.getElementById('stepHelp').textContent = STEP_HELP[step]||"";
  const body = document.getElementById('stepBody');
  if (step===1) body.innerHTML = step1(d);
  if (step===2) body.innerHTML = step2(d);
  if (step===3) body.innerHTML = step3(d);
  if (step===4) body.innerHTML = step4(d);
  if (step===5) body.innerHTML = step5(d);
  if (step===6) body.innerHTML = step6(d);
  if (step===7) body.innerHTML = step7(d);
  if (step===8) body.innerHTML = step8(d);
  if (step===9) body.innerHTML = step9(d);
  bindStep(step);
}

          <button type="button" onclick="setProb('${p.id}','concern','R')" class="${p.concern==='R'?'on':''}">Razoável</button>
          <button type="button" onclick="setProb('${p.id}','concern','P')" class="${p.concern==='P'?'on':''}">Pouco</button>

}
window.addProblem = function(){
  wizardState.data.healthProblems.push({ id:uuid(), name:"", startDate:"", controlled:"", concern:"", notes:"" });
  persist(); drawStep(2);
};
window.removeProblem = function(id){
  wizardState.data.healthProblems = wizardState.data.healthProblems.filter(p=>p.id!==id);
  /* unlink from medications */
  wizardState.data.medications.forEach(m=>{ m.linkedProblemIds = (m.linkedProblemIds||[]).filter(x=>x!==id); });
  persist(); drawStep(2);
};
window.setProb = function(id,key,val){
  const p = wizardState.data.healthProblems.find(x=>x.id===id);
  if (p){ p[key]=val; persist(); drawStep(2); }
};

/* ---------- STEP 3: Sacola de Medicamentos (10 perguntas Dáder) ---------- */
function step3(d){
  const meds = d.medications;
  const probs = d.healthProblems;
  const list = meds.map((m,idx)=>{
    const ssri = m.type==='ssri' && m.drugId ? SSRI_BY_ID[m.drugId] : null;
    const cv = m.type==='cv' && m.drugId ? CV_BY_ID[m.drugId] : null;
    let drugSel;
    if (m.type==='ssri'){
      drugSel = `<select data-med="${m.id}" data-key="drugId">
        <option value="">Selecione um ISRS</option>
        ${SSRIS.map(s=>`<option value="${s.id}" ${m.drugId===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select>`;
    } else if (m.type==='cv'){
      drugSel = `<select data-med="${m.id}" data-key="drugId">
        <option value="">Selecione um fármaco CV</option>
        ${CV_DRUGS.map(c=>`<option value="${c.id}" ${m.drugId===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>`;
    } else {
      drugSel = `<input data-med="${m.id}" data-key="name" value="${escapeHtml(m.name)}" placeholder="Nome do medicamento"/>`;
    }
    let pills = '';
    if (ssri){
      pills = `<div class="meta-pills"><span class="lbl">Inibidor CYP:</span>${Object.entries(ssri.inhibition).map(([iso,lvl])=>{
        const cl = lvl==='forte'?'red': lvl==='moderado'?'amber':'';
        return `<span class="badge ${cl}">${iso}: ${lvl}</span>`;
      }).join('')}</div>`;
    } else if (cv){
      pills = `<div class="meta-pills"><span class="lbl">Substrato CYP:</span>${Object.entries(cv.substrate).map(([iso,r])=>`<span class="badge">${iso} (${r})</span>`).join('') || '<span class="muted small">sem CYP relevante</span>'}
        ${cv.qtRisk?' <span class="badge purple">Risco QT</span>':''}
        ${cv.isProdrug?' <span class="badge orange">Pró-fármaco</span>':''}
        ${cv.narrowTI?' <span class="badge red">Janela Estreita</span>':''}
      </div>`;
    }
    const probLinks = probs.map(p=>`<label class="chk" style="font-size:12px"><input type="checkbox" data-medlink="${m.id}" data-prob="${p.id}" ${(m.linkedProblemIds||[]).includes(p.id)?'checked':''}/> ${escapeHtml(p.name||'(sem nome)')}</label>`).join('') || '<span class="muted small">Cadastre os problemas na Etapa 2 para vincular.</span>';
    return `<div class="item-card">
      <button class="btn ghost rm danger sm" onclick="removeMed('${m.id}')">🗑</button>
      <div class="item-head">💊 Medicamento #${idx+1}${m.name?` — ${escapeHtml(m.name)}`:''}</div>

      <div class="sub-h">Dados básicos</div>

            <option value="cv" ${m.type==='cv'?'selected':''}>Cardiovascular</option>
            <option value="other" ${m.type==='other'?'selected':''}>Outro</option>
          </select>
        </div>
        <div class="col-4"><label>Princípio ativo / nome</label>${drugSel}</div>
        <div class="col-2"><label>Dose</label><input data-med="${m.id}" data-key="dose" value="${escapeHtml(m.dose)}" placeholder="20mg"/></div>
        <div class="col-2"><label>Frequência</label><input data-med="${m.id}" data-key="frequency" value="${escapeHtml(m.frequency)}" placeholder="1x/dia"/></div>
        <div class="col-2"><label>Via</label><input data-med="${m.id}" data-key="route" value="${escapeHtml(m.route||'VO')}"/></div>
      </div>
      ${pills}

      <div class="sub-h">Entrevista Dáder — 10 perguntas</div>
      <div class="grid grid-12" style="gap:12px">
        <div class="col-3"><label>1. Ainda utiliza?</label>
          <div class="seg">
            <button type="button" onclick="setMed('${m.id}','stillUsing',true)" class="${m.stillUsing!==false?'on':''}">Sim</button>
            <button type="button" onclick="setMed('${m.id}','stillUsing',false)" class="${m.stillUsing===false?'on':''}">Não</button>
          </div>
        </div>
        <div class="col-3"><label>2. Quem prescreveu?</label><input data-med="${m.id}" data-key="prescriber" value="${escapeHtml(m.prescriber)}" placeholder="Médico, especialidade"/></div>
        <div class="col-6"><label>3. Para que serve (na visão do paciente)?</label><input data-med="${m.id}" data-key="patientUnderstanding" value="${escapeHtml(m.patientUnderstanding)}" placeholder="Como o paciente entende o uso"/></div>
        <div class="col-3"><label>4. Está melhorando?</label>
          <div class="seg">
            <button type="button" onclick="setMed('${m.id}','improving','S')" class="${m.improving==='S'?'on':''}">Sim</button>
            <button type="button" onclick="setMed('${m.id}','improving','N')" class="${m.improving==='N'?'on':''}">Não</button>
            <button type="button" onclick="setMed('${m.id}','improving','-')" class="${m.improving==='-'?'on':''}">N/A</button>
          </div>
        </div>
        <div class="col-3"><label>5. Desde quando usa?</label><input type="date" data-med="${m.id}" data-key="sinceDate" value="${escapeHtml(m.sinceDate)}"/></div>
        <div class="col-3"><label>6. Posologia (M-T-N)</label><input data-med="${m.id}" data-key="posology" value="${escapeHtml(m.posology)}" placeholder="Ex: 1-0-1"/></div>
        <div class="col-3"><label>7. Como usa?</label><input data-med="${m.id}" data-key="howTaken" value="${escapeHtml(m.howTaken)}" placeholder="Antes/durante/após refeição"/></div>
        <div class="col-3"><label>8. Até quando deve usar?</label><input data-med="${m.id}" data-key="untilWhen" value="${escapeHtml(m.untilWhen)}" placeholder="Ex: 6 meses, contínuo"/></div>
        <div class="col-3"><label>Indicação clínica</label><input data-med="${m.id}" data-key="indication" value="${escapeHtml(m.indication)}"/></div>
        <div class="col-6"><label>9. Alguma dificuldade? (engolir, sabor, injetar)</label><input data-med="${m.id}" data-key="difficulty" value="${escapeHtml(m.difficulty)}"/></div>
        <div class="col-6"><label>10. Algo estranho? (efeito adverso percebido)</label><input data-med="${m.id}" data-key="adverse" value="${escapeHtml(m.adverse)}"/></div>
      </div>

      <div class="sub-h">Avaliação subjetiva</div>
      <div class="grid grid-12" style="gap:12px">
        <div class="col-6"><label>Adesão (Muito / Razoável / Pouco)</label>
          <div class="seg">
            <button type="button" onclick="setMed('${m.id}','adherence','M')" class="${m.adherence==='M'?'on':''}">Muito</button>
            <button type="button" onclick="setMed('${m.id}','adherence','R')" class="${m.adherence==='R'?'on':''}">Razoável</button>
            <button type="button" onclick="setMed('${m.id}','adherence','P')" class="${m.adherence==='P'?'on':''}">Pouca</button>
          </div>
        </div>
        <div class="col-6"><label>Conhecimento sobre o medicamento</label>
          <div class="seg">
            <button type="button" onclick="setMed('${m.id}','knowledge','M')" class="${m.knowledge==='M'?'on':''}">Muito</button>
            <button type="button" onclick="setMed('${m.id}','knowledge','R')" class="${m.knowledge==='R'?'on':''}">Razoável</button>
            <button type="button" onclick="setMed('${m.id}','knowledge','P')" class="${m.knowledge==='P'?'on':''}">Pouco</button>
          </div>
        </div>
      </div>

      <div class="sub-h">Vínculo com Problema(s) de Saúde</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px">${probLinks}</div>
    </div>`;
  }).join('');
  return `<div>
    ${list || '<div class="empty"><div class="icon">💊</div><h3>Sacola de medicamentos vazia</h3><p>Adicione cada medicamento que o paciente trouxe e responda às 10 perguntas do Método Dáder.</p></div>'}
    <button class="add-btn" onclick="addMed()" style="margin-top:14px">＋ Adicionar Medicamento à Sacola</button>
  </div>`;
}
window.addMed = function(){
  wizardState.data.medications.push({
    id:uuid(), type:"other", drugId:"", name:"", dose:"", frequency:"", route:"VO", indication:"",
    stillUsing:true, prescriber:"", patientUnderstanding:"", improving:"", sinceDate:"",
    posology:"", howTaken:"", untilWhen:"", difficulty:"", adverse:"",
    adherence:"", knowledge:"", linkedProblemIds:[]
  });

};

  wizardState.data.medications = wizardState.data.medications.filter(m=>m.id!==id);

  const m = wizardState.data.medications.find(x=>x.id===id);

};

          <div><label>HbA1c ${infoTip('HbA1c — Hemoglobina glicada','Reflete a média glicêmica dos últimos ~3 meses (%). Normal <5,7%; pré-diabetes 5,7–6,4%; diabetes ≥6,5%. Meta usual no diabético: <7% (individualizar).')}</label><input data-bind="parameters.hba1c" value="${escapeHtml(pa.hba1c)}" placeholder="Ex: 03/2026 6.8%"/></div>
          <div><label>Colesterol total ${infoTip('Colesterol total','Soma das frações lipídicas (mg/dL). Desejável <190. O risco depende sobretudo do LDL e do risco cardiovascular global — a meta de LDL é individualizada por estrato de risco.')}</label><input data-bind="parameters.cholesterol" value="${escapeHtml(pa.cholesterol)}"/></div>
          <div><label>Ácido úrico ${infoTip('Ácido úrico','Produto do metabolismo das purinas (mg/dL). Referência aprox.: homens 3,4–7,0; mulheres 2,4–6,0. Valores altos (hiperuricemia) associam-se à gota e podem ser afetados por diuréticos.')}</label><input data-bind="parameters.uricAcid" value="${escapeHtml(pa.uricAcid)}"/></div>
          <div><label>Temperatura</label><input data-bind="parameters.temperature" value="${escapeHtml(pa.temperature)}"/></div>
        </div>
        <hr class="sep"/>
        <div class="grid grid-4" style="gap:12px">
          <div><label>Creatinina (mg/dL) ${infoTip('Creatinina — função renal','Marcador de função renal usado no cálculo da TFG. Referência aprox.: 0,6–1,2 mg/dL. Valores elevados indicam redução da função renal e podem exigir ajuste de dose de fármacos de eliminação renal.')}</label><input type="number" step="0.1" data-bind="labs.creatinine" value="${l.creatinine||''}"/></div>
          <div><label>Potássio (mEq/L) ${infoTip('Potássio (K⁺) — eletrólito','Referência aprox.: 3,5–5,0 mEq/L. Hiper ou hipocalemia aumentam o risco de arritmias. Frequentemente alterado por IECA/BRA, espironolactona e diuréticos — atenção às combinações.')}</label><input type="number" step="0.1" data-bind="labs.potassium" value="${l.potassium||''}"/></div>
          <div><label>AST (U/L) ${infoTip('AST (TGO) — enzima hepática','Aspartato aminotransferase. Presente no fígado, músculo e coração. Referência aprox.: 10–40 U/L. Elevação sugere lesão hepatocelular — útil para monitorar hepatotoxicidade (ex.: estatinas).')}</label><input type="number" data-bind="labs.ast" value="${l.ast||''}"/></div>
          <div><label>ALT (U/L) ${infoTip('ALT (TGP) — enzima hepática','Alanina aminotransferase. Mais específica do fígado que a AST. Referência aprox.: 7–56 U/L. Elevação indica lesão hepatocelular — parâmetro-chave para acompanhar segurança hepática da farmacoterapia.')}</label><input type="number" data-bind="labs.alt" value="${l.alt||''}"/></div>
        </div>
        <div style="margin-top:12px"><label>Outros exames relevantes</label><input data-bind="labs.other" value="${escapeHtml(l.other)}"/></div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div class="card-t">🔍 Revisão por Sistemas (Cabeça aos Pés)</div></div>
      <div class="card-c">
        <div class="grid grid-3" style="gap:12px">
          ${sysFields.map(([k,t])=>`<div><label>${t}</label><input data-bind="systems.${k}" value="${escapeHtml(sy[k])}" placeholder="Achados / queixas"/></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div class="card-t">🌿 Hábitos de Vida & Estilo</div></div>
      <div class="card-c">
        <div class="grid grid-3" style="gap:12px">
          <div><label>Cigarro</label><input data-bind="lifestyle.smoking" value="${escapeHtml(lf.smoking)}" placeholder="Ex: 10 cig/dia há 20 anos"/></div>
          <div><label>Álcool</label><input data-bind="lifestyle.alcohol" value="${escapeHtml(lf.alcohol)}"/></div>
          <div><label>Café</label><input data-bind="lifestyle.coffee" value="${escapeHtml(lf.coffee)}"/></div>
          <div><label>Chás</label><input data-bind="lifestyle.teas" value="${escapeHtml(lf.teas)}"/></div>
          <div><label>Outras drogas</label><input data-bind="lifestyle.otherDrugs" value="${escapeHtml(lf.otherDrugs)}"/></div>
          <div><label>Atividade física</label><input data-bind="lifestyle.physicalActivity" value="${escapeHtml(lf.physicalActivity)}"/></div>
          <div><label>Dietas especiais</label><input data-bind="lifestyle.diets" value="${escapeHtml(lf.diets)}"/></div>
          <div><label>Vitaminas/suplementos</label><input data-bind="lifestyle.vitamins" value="${escapeHtml(lf.vitamins)}"/></div>
          <div><label>Vacinas</label><input data-bind="lifestyle.vaccines" value="${escapeHtml(lf.vaccines)}"/></div>
        </div>
        <hr class="sep"/>
        <div><label>Alergias a medicamentos</label><input data-bind="allergies" value="${escapeHtml(d.allergies)}" placeholder="Ex: penicilina, sulfa..."/></div>
      </div>
    </div>
  </div>`;
}

/* ---------- STEP 5: Estado de Situação ---------- */
function step5(d){
  const probs = d.healthProblems;
  const meds = d.medications;
  /* Build linked rows: for each problem, list its meds; orphan meds at end */
  const rows = [];
  probs.forEach(p=>{
    const linked = meds.filter(m=>(m.linkedProblemIds||[]).includes(p.id));
    if (linked.length===0){
      rows.push({ prob:p, med:null });
    } else {
      linked.forEach(m=>rows.push({ prob:p, med:m }));
    }
  });
  /* Meds without any problem link */
  meds.forEach(m=>{
    if (!(m.linkedProblemIds||[]).length) rows.push({ prob:null, med:m });
  });
  if (rows.length===0){
    return `<div class="empty"><div class="icon">📋</div><h3>Sem dados para gerar Estado de Situação</h3><p>Adicione problemas de saúde (Etapa 2) e medicamentos (Etapa 3) para visualizar a "foto do paciente".</p></div>`;
  }
  /* Compute eval per med (interactions + suspect PRM) */
  const ssris = meds.filter(m=>m.type==='ssri'&&m.drugId).map(m=>SSRI_BY_ID[m.drugId]).filter(Boolean);
  const cvs = meds.filter(m=>m.type==='cv'&&m.drugId).map(m=>CV_BY_ID[m.drugId]).filter(Boolean);
  const ints = evaluateAll(ssris,cvs);
  function medEval(m){
    if (!m || !m.drugId) return { eval:'-', suspect:'' };
    if (m.type==='ssri'){
      const list = ints.filter(i=>i.ssriId===m.drugId && i.severity!=='minimo');
      if (list.length===0) return { eval:'N/E/S ✓', suspect:'-' };
      const max = list.reduce((a,b)=>b.severityScore>a.severityScore?b:a);
      return { eval:`<span class="badge ${({contraindicado:'red',grave:'orange',moderado:'yellow',leve:'cyan'})[max.severity]}">${SEV_LABEL[max.severity]}</span>`, suspect:`Segurança — interação CYP com ${max.cvName}` };
    }
    if (m.type==='cv'){
      const list = ints.filter(i=>i.cvId===m.drugId && i.severity!=='minimo');
      if (list.length===0) return { eval:'N/E/S ✓', suspect:'-' };
      const max = list.reduce((a,b)=>b.severityScore>a.severityScore?b:a);
      const isProSafety = max.flags.prodrugFailure ? 'Efetividade — pró-fármaco' : 'Segurança';
      return { eval:`<span class="badge ${({contraindicado:'red',grave:'orange',moderado:'yellow',leve:'cyan'})[max.severity]}">${SEV_LABEL[max.severity]}</span>`, suspect:`${isProSafety} — interação CYP com ${max.ssriName}` };
    }
    return { eval:'-', suspect:'-' };
  }
  return `<div>
    <div class="alert info" style="margin-bottom:18px"><div>ℹ</div><div><div class="t">Foto do paciente (Estado de Situação)</div>Tabela gerada automaticamente. A coluna <strong>Avaliação N/E/S</strong> e <strong>Suspeita de PRM</strong> usam o motor de interações CYP450 do Farmacompanha. Os vínculos medicamento↔problema são editados na Etapa 3.</div></div>
    <div class="tbl-wrap">
      <table class="tbl es-tbl">
        <thead><tr>
          <th>Problema de saúde</th><th>Início</th><th>Ctrl</th><th>Preoc.</th>
          <th>Medicamento</th><th>Início</th><th>Posologia</th><th>Conhec / Adesão</th>
          <th>Avaliação (N/E/S)</th><th>Suspeita de PRM</th>
        </tr></thead>
        <tbody>
        ${rows.map(r=>{
          const ev = medEval(r.med);
          return `<tr>
            <td>${r.prob?escapeHtml(r.prob.name||'(sem nome)'):'<span class="muted">— Sem PS vinculado —</span>'}</td>
            <td>${r.prob?fmtDateOnly(r.prob.startDate):'-'}</td>
            <td>${r.prob?(r.prob.controlled||'-'):'-'}</td>
            <td>${r.prob?(r.prob.concern||'-'):'-'}</td>
            <td>${r.med?`<strong>${escapeHtml(r.med.name||'-')}</strong> ${r.med.dose?'<span class="muted small">'+escapeHtml(r.med.dose)+'</span>':''}`:'<span class="muted">— Sem medicamento —</span>'}</td>
            <td>${r.med?fmtDateOnly(r.med.sinceDate):'-'}</td>
            <td>${r.med?escapeHtml(r.med.posology||r.med.frequency||'-'):'-'}</td>
            <td>${r.med?`${r.med.knowledge||'-'} / ${r.med.adherence||'-'}`:'-'}</td>
            <td>${ev.eval}</td>
            <td>${ev.suspect}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
    <div style="margin-top:18px">
      <label>Notas livres da entrevista (observações não estruturadas)</label>
      <textarea data-bind="observations" placeholder="Anote percepções, contexto familiar, condições socioeconômicas, etc.">${escapeHtml(d.observations)}</textarea>
    </div>
  </div>`;
}

/* ---------- STEP 6: Fase de Estudo ---------- */
function step6(d){
  const ssris = d.medications.filter(m=>m.type==='ssri'&&m.drugId).map(m=>SSRI_BY_ID[m.drugId]).filter(Boolean);
  const cvs = d.medications.filter(m=>m.type==='cv'&&m.drugId).map(m=>CV_BY_ID[m.drugId]).filter(Boolean);
  const ints = evaluateAll(ssris,cvs).sort((a,b)=>b.severityScore-a.severityScore);
  const sevCards = `<div class="sev-summary">
    ${SEV_ORDER.map(s=>{
      const c = ints.filter(i=>i.severity===s).length;
      return `<div class="sc ${s} ${c===0?'zero':''}"><div class="n">${c}</div><div class="l">${SEV_LABEL[s]}</div></div>`;
    }).join('')}
  </div>`;
  const intsHtml = ints.length===0
    ? `<div class="empty">Nenhuma combinação ISRS × Cardiovascular identificada na sacola.</div>`
    : ints.map(i=>`<div class="int-card ${i.severity}">
        <div class="h">
          <div>
            <div class="t">${i.ssriName}<span class="lk">afeta</span>${i.cvName}</div>
            <div class="d">${i.cvClass}</div>
          </div>
          <span class="badge ${({contraindicado:'red',grave:'orange',moderado:'yellow',leve:'cyan',minimo:'slate'})[i.severity]}" style="font-size:12px;padding:5px 10px">${SEV_LABEL[i.severity].toUpperCase()} • Score ${i.severityScore}/10</span>
        </div>
        <div class="b">
          ${i.isoforms.length>0?`<div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${i.isoforms.map(h=>`<span class="badge purple">${h.isoform}: ${h.inhibition} → Substrato ${h.role}</span>`).join('')}</div>`:''}
          ${(i.flags.prodrugFailure||i.flags.narrowTI||i.flags.qtRisk)?`<div class="row" style="display:flex;gap:6px;flex-wrap:wrap">
            ${i.flags.prodrugFailure?'<span class="badge red">⚠ Risco Falha Pró-Fármaco</span>':''}
            ${i.flags.narrowTI?'<span class="badge red">⚠ Janela Terapêutica Estreita</span>':''}
            ${i.flags.qtRisk?'<span class="badge red">⚠ Risco QT Aditivo</span>':''}
          </div>`:''}
          <div class="grid grid-2" style="gap:18px">
            <div><h5>Mecanismo</h5><p>${escapeHtml(i.mechanism)}</p></div>
            <div><h5>Impacto Clínico</h5><p>${escapeHtml(i.clinicalImpact)}</p></div>
          </div>
          <div class="reco"><h5>⚠ Recomendação Clínica</h5><p style="font-weight:500">${escapeHtml(i.recommendation)}</p></div>
        </div>
      </div>`).join('');
  /* Knowledge cards: ISRS + CV */
  const knowSsri = ssris.map(s=>`<div class="know">
    <h4>💊 ${s.name} <span class="badge purple">ISRS</span></h4>
    <dl>
      <dt>Indicações</dt><dd>${escapeHtml(s.indications)}</dd>
      <dt>Marcas</dt><dd>${s.brand.join(', ')}</dd>
      <dt>Meia-vida</dt><dd>${escapeHtml(s.halfLife)}</dd>
      <dt>CYP2D6</dt><dd>${s.inhibition.CYP2D6}</dd>
      <dt>CYP2C19</dt><dd>${s.inhibition.CYP2C19}</dd>
      <dt>CYP3A4</dt><dd>${s.inhibition.CYP3A4}</dd>
      <dt>Notas</dt><dd>${escapeHtml(s.notes)}</dd>
    </dl>
  </div>`).join('');
  const knowCv = cvs.map(c=>`<div class="know">
    <h4>❤ ${c.name} <span class="badge cyan">${c.classLabel}</span></h4>
    <dl>
      <dt>Substrato</dt><dd>${Object.entries(c.substrate).map(([i,r])=>`${i} (${r})`).join(', ')||'-'}</dd>
      <dt>Atenção</dt><dd>${[c.qtRisk?'Risco QT':null,c.isProdrug?'Pró-fármaco':null,c.narrowTI?'Janela estreita':null].filter(Boolean).join(', ')||'-'}</dd>
      <dt>Notas</dt><dd>${escapeHtml(c.notes)}</dd>
    </dl>
  </div>`).join('');
  return `<div>
    <h3 style="margin:0 0 12px;font-size:16px">Resumo de interações detectadas</h3>
    ${sevCards}
    <h3 style="margin:24px 0 12px;font-size:16px">Análise detalhada</h3>
    ${intsHtml}
    <h3 style="margin:32px 0 12px;font-size:16px">Apoio à decisão — fármacos da sacola</h3>
    <div class="grid grid-2">
      <div><h5 class="muted small" style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">ISRS</h5>${knowSsri || '<div class="empty small">Nenhum ISRS na sacola</div>'}</div>
      <div><h5 class="muted small" style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Cardiovasculares</h5>${knowCv || '<div class="empty small">Nenhum cardiovascular na sacola</div>'}</div>
    </div>
    <hr class="sep" style="margin:28px 0"/>
    <div>
      <label>Notas da fase de estudo (raciocínio clínico)</label>
      <textarea data-bind="studyNotes" style="min-height:140px" placeholder="Registre o raciocínio: quais problemas de saúde precisam ser priorizados, quais riscos de IM são clinicamente relevantes neste paciente...">${escapeHtml(d.studyNotes)}</textarea>
    </div>
  </div>`;
}

/* ---------- STEP 7: Avaliação PRM ---------- */
function step7(d){
  /* Auto-create one PRM evaluation per medication (if missing) */
  d.medications.forEach(m=>{
    if (!d.prms.find(p=>p.relatedMedId===m.id)){
      d.prms.push({ id:uuid(), relatedMedId:m.id, relatedProblemId:"", needs:"", effective:"", effectiveQuant:false, safe:"", safeQuant:false, classification:0, description:"" });
    }
  });
  /* Recompute classifications */
  d.prms.forEach(p=>{ p.classification = classifyPRM(p); });
  persist();
  const cards = d.prms.filter(p=>p.relatedMedId).map(p=>{
    const m = d.medications.find(x=>x.id===p.relatedMedId);
    if (!m) return '';
    const cls = p.classification;
    return `<div class="prm-card">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-weight:600;font-size:15px">💊 ${escapeHtml(m.name||'(sem nome)')} <span class="muted small" style="margin-left:6px">${escapeHtml(m.dose)} ${escapeHtml(m.frequency)}</span></div>
          <div class="muted small">${escapeHtml(m.indication||'sem indicação registrada')}</div>
        </div>
        ${cls>0?`<span class="badge purple" style="font-size:12px;padding:5px 10px">${PRM_LABEL[cls]}</span>`:`<span class="badge emerald">Sem PRM</span>`}
      </div>
      <div class="qline">
        <div class="q"><strong>1. Necessidade</strong> — O paciente <em>necessita</em> deste medicamento? ${infoTip('Necessidade (Granada)','Avalia se há um problema de saúde que justifique o uso. Responder "Não" gera PRM 2 (medicamento desnecessário). Já um problema de saúde SEM medicamento necessário gera PRM 1 (adicionado à parte, abaixo).')}</div>
        <div class="seg">
          <button type="button" onclick="setPRM('${p.id}','needs','S')" class="${p.needs==='S'?'on':''}">Sim</button>
          <button type="button" onclick="setPRM('${p.id}','needs','N')" class="${p.needs==='N'?'on':''}">Não</button>
        </div>
      </div>
      <div class="qline">
        <div class="q"><strong>2. Efetividade</strong> — Está sendo <em>efetivo</em>? (controlando o problema) ${infoTip('Efetividade (Granada)','Avalia se o medicamento atinge o objetivo terapêutico. "Não" gera PRM 3 (inefetividade não quantitativa) ou PRM 4 se for quantitativa — quando o problema é a dose/frequência insuficiente (dose baixa).')}</div>
        <div class="seg">
          <button type="button" onclick="setPRM('${p.id}','effective','S')" class="${p.effective==='S'?'on':''}">Sim</button>
          <button type="button" onclick="setPRM('${p.id}','effective','N')" class="${p.effective==='N'?'on':''}">Não</button>
        </div>
        ${p.effective==='N'?`<label class="chk small"><input type="checkbox" ${p.effectiveQuant?'checked':''} onchange="setPRM('${p.id}','effectiveQuant',this.checked)"/> Quantitativa? (dose baixa) ${infoTip('Inefetividade quantitativa','Marque se a falha se deve à dose/posologia insuficiente (o fármaco funcionaria com ajuste). Marcado → PRM 4; desmarcado → PRM 3 (o fármaco não é adequado, independentemente da dose).')}</label>`:''}
      </div>
      <div class="qline">
        <div class="q"><strong>3. Segurança</strong> — Está sendo <em>seguro</em>? (sem evento adverso/IM) ${infoTip('Segurança (Granada)','Avalia se o medicamento causa dano (reação adversa, interação). "Não" gera PRM 5 (insegurança não quantitativa) ou PRM 6 se for quantitativa — quando o problema depende da dose (dose alta).')}</div>
        <div class="seg">
          <button type="button" onclick="setPRM('${p.id}','safe','S')" class="${p.safe==='S'?'on':''}">Sim</button>
          <button type="button" onclick="setPRM('${p.id}','safe','N')" class="${p.safe==='N'?'on':''}">Não</button>
        </div>
        ${p.safe==='N'?`<label class="chk small"><input type="checkbox" ${p.safeQuant?'checked':''} onchange="setPRM('${p.id}','safeQuant',this.checked)"/> Quantitativa? (dose alta) ${infoTip('Insegurança quantitativa','Marque se o dano depende da dose (reduzir a dose resolveria). Marcado → PRM 6; desmarcado → PRM 5 (o dano ocorre independentemente da dose, ex.: alergia/interação).')}</label>`:''}
      </div>
      <div style="margin-top:10px">
        <label>Descrição do PRM / racional</label>
        <textarea data-prm="${p.id}" data-key="description" placeholder="Descreva o problema relacionado ao medicamento identificado...">${escapeHtml(p.description)}</textarea>
      </div>
      ${cls>0?`<div class="class-out"><strong>Classificação Granada:</strong> ${PRM_LABEL[cls]}</div>`:`<div class="class-out none"><strong>✓ Sem PRM identificado</strong> para este medicamento.</div>`}
    </div>`;
  }).join('');
  /* PRM 1 — untreated problems */
  const untreatedHTML = `<div class="prm-card">
    <div style="font-weight:600;margin-bottom:8px">🩺 PRM 1 — Problema de Saúde Não Tratado</div>
    <p class="muted small">Adicione manualmente, se houver, problemas de saúde que precisariam de um medicamento não prescrito.</p>
    ${d.prms.filter(p=>p.classification===1 || (!p.relatedMedId && p.relatedProblemId)).map(p=>`<div style="display:flex;gap:10px;align-items:center;margin-top:8px">
      <select data-prm="${p.id}" data-key="relatedProblemId" style="width:280px">
        <option value="">Selecione o problema...</option>
        ${d.healthProblems.map(hp=>`<option value="${hp.id}" ${p.relatedProblemId===hp.id?'selected':''}>${escapeHtml(hp.name)}</option>`).join('')}
      </select>
      <input data-prm="${p.id}" data-key="description" value="${escapeHtml(p.description)}" placeholder="Descrição da necessidade não atendida..."/>
      <button class="btn ghost danger sm" onclick="removePRM('${p.id}')">🗑</button>
    </div>`).join('')}
    <button class="add-btn" style="margin-top:10px" onclick="addPRM1()">＋ Adicionar PRM 1</button>
  </div>`;
  return `<div>
    <div class="alert info" style="margin-bottom:18px"><div>ℹ</div><div><div class="t">Consenso de Granada</div>Para cada medicamento da sacola, responda às 3 perguntas (Necessidade, Efetividade, Segurança). A classificação PRM é gerada automaticamente.</div></div>
    ${cards || '<div class="empty">Adicione medicamentos na Etapa 3 para realizar a avaliação PRM.</div>'}
    ${untreatedHTML}
  </div>`;
}
window.setPRM = function(id,key,val){
  const p = wizardState.data.prms.find(x=>x.id===id);
  if (p){ p[key]=val; p.classification = classifyPRM(p); persist(); drawStep(7); }
};
window.removePRM = function(id){
  wizardState.data.prms = wizardState.data.prms.filter(p=>p.id!==id);
  persist(); drawStep(7);
};
window.addPRM1 = function(){
  wizardState.data.prms.push({ id:uuid(), relatedMedId:"", relatedProblemId:"", needs:"", effective:"", effectiveQuant:false, safe:"", safeQuant:false, classification:1, description:"" });
  persist(); drawStep(7);
};

/* ---------- STEP 8: Plano de Intervenção ---------- */
function generateDoctorLetter(d){
  const today = new Date().toLocaleDateString('pt-BR');
  const prms = d.prms.filter(p=>classifyPRM(p)>0);
  const ssris = d.medications.filter(m=>m.type==='ssri'&&m.drugId).map(m=>SSRI_BY_ID[m.drugId]).filter(Boolean);
  const cvs = d.medications.filter(m=>m.type==='cv'&&m.drugId).map(m=>CV_BY_ID[m.drugId]).filter(Boolean);
  const ints = evaluateAll(ssris,cvs).filter(i=>i.severity!=='minimo' && i.severity!=='leve').sort((a,b)=>b.severityScore-a.severityScore);
  let medsBlock = d.medications.map(m=>`  • ${m.name||'-'} ${m.dose||''} ${m.frequency||''}${m.indication?' (para '+m.indication+')':''}`).join('\n');
  let prmBlock = prms.length===0 ? "  Nenhum PRM clinicamente relevante identificado." :
    prms.map(p=>{
      const m = d.medications.find(x=>x.id===p.relatedMedId);
      return `  • ${PRM_LABEL[p.classification]}${m?' — '+m.name:''}${p.description?': '+p.description:''}`;
    }).join('\n');
  let intBlock = ints.length===0 ? "  Nenhuma interação medicamentosa de alta gravidade identificada via CYP450." :
    ints.map(i=>`  • ${i.ssriName} × ${i.cvName} — ${SEV_LABEL[i.severity]} (score ${i.severityScore}/10): ${i.recommendation}`).join('\n');
  const age = d.anthropometric.age ? `${d.anthropometric.age} anos` : "idade não informada";
  const titles = pharmacistTitles(d.service);
  return `RELATÓRIO FARMACÊUTICO — SEGUIMENTO FARMACOTERAPÊUTICO

${today}

Para: _____________________
De:   ${d.service.pharmacistName||'Farmacêutico(a) Responsável'}${d.service.pharmacistCRF?' — '+d.service.pharmacistCRF:''}

Prezado(a) Doutor(a),

Apresento o(a) paciente ${d.patient.name||'________________'}, ${age}${d.patient.recordNumber?', prontuário '+d.patient.recordNumber:''}, em acompanhamento farmacoterapêutico nesta farmácia segundo o Método Dáder.

MOTIVO DO ENCAMINHAMENTO
${d.service.consultReason||'Encaminhamento para revisão da farmacoterapia.'}

FARMACOTERAPIA ATUAL
${medsBlock||'  (Sacola de medicamentos vazia.)'}

PROBLEMAS RELACIONADOS A MEDICAMENTOS (PRM) IDENTIFICADOS
${prmBlock}

INTERAÇÕES MEDICAMENTOSAS RELEVANTES (CYP450)
${intBlock}

AVALIAÇÃO FARMACÊUTICA
A avaliação realizada não tem caráter diagnóstico. Identificamos os pontos acima a partir da análise de necessidade, efetividade e segurança da farmacoterapia, conforme o Consenso de Granada.

PLANO PROPOSTO
${d.intervention.actionPlan||'  (Plano a ser definido em conjunto com o(a) Sr(a) Doutor(a).)'}

Coloco-me à disposição para colaborar no manejo deste(a) paciente e agradeço sua atenção.

Atenciosamente,

________________________________
${d.service.pharmacistName||'Farmacêutico(a) Responsável'}
${d.service.pharmacistCRF||'CRF: ___________'}${titles?'\n'+titles:''}`;
}

/* =====================================================================
   ESCORES CARDIOVASCULARES — calculados a partir dos dados da avaliação
   CHA₂DS₂-VASc: fatores de risco + idade + sexo (Etapa 1).
   HAS-BLED: o que dá para derivar (AVC, idade, creatinina, antiplaquetário/AINE
   na sacola) + critérios marcados à mão no próprio card.
   ===================================================================== */
const BLEEDING_DRUGS = ['aas','acido acetilsalicilico','aspirina','clopidogrel','prasugrel','ticagrelor','ticlopidina','cilostazol','dipiridamol',
  'ibuprofeno','naproxeno','diclofenaco','cetoprofeno','nimesulida','piroxicam','meloxicam','tenoxicam','celecoxibe','etoricoxibe','indometacina','acido mefenamico'];
const normTxt = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function patientAge(d){
  if (d.anthropometric.age) return Number(d.anthropometric.age);
  const b = d.patient.birthDate; if (!b) return 0;
  const bd = new Date(b + 'T00:00:00'), now = new Date();
  let age = now.getFullYear() - bd.getFullYear();
  const m = now.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < bd.getDate())) age--;
  return age > 0 ? age : 0;
}
function bleedingDrugsInUse(d){
  return (d.medications||[]).filter(m=>m.stillUsing!==false && m.name).map(m=>m.name)
    .filter(n=>{ const t = normTxt(n); return BLEEDING_DRUGS.some(k=>new RegExp('\\b' + k + '\\b').test(t)); });
}
function cha2ds2vascScore(d){
  const rf = d.cvProfile.riskFactors, age = patientAge(d), sex = d.patient.gender, fem = sex === 'F';
  const ageSrc = age ? `Idade: ${age} anos` : 'Idade não informada';
  const items = [
    { t:'Insuficiência cardíaca', p:1, on:!!rf.hf, src:'Fatores de risco' },
    { t:'Hipertensão', p:1, on:!!rf.has, src:'Fatores de risco' },
    { t:'Idade ≥ 75 anos', p:2, on:age >= 75, src:ageSrc },
    { t:'Diabetes', p:1, on:!!rf.dm, src:'Fatores de risco' },
    { t:'AVC/AIT prévio', p:2, on:!!rf.previousStroke, src:'Fatores de risco' },
    { t:'Doença vascular (IAM prévio ou DAP)', p:1, on:!!(rf.previousMI || rf.pad), src:'Fatores de risco' },
    { t:'Idade 65–74 anos', p:1, on:age >= 65 && age < 75, src:ageSrc },
    { t:'Sexo feminino', p:1, on:fem, src:sex ? `Sexo: ${sex === 'F' ? 'feminino' : 'masculino'}` : 'Sexo não informado (Etapa 1)' },
  ];
  const score = items.reduce((s,i)=>s + (i.on ? i.p : 0), 0);
  // limiares por sexo: o ponto do sexo feminino sozinho não indica anticoagulação
  const base = score - (fem ? 1 : 0);
  return { score, items, level: base >= 2 ? 'alto' : base === 1 ? 'intermediario' : 'baixo', missing: !age || !sex };
}
function hasBledScore(d){
  const rf = d.cvProfile.riskFactors, hb = d.cvProfile.hasBledFactors || {}, age = patientAge(d);
  const cr = Number(d.labs.creatinine) || 0, drugs = bleedingDrugsInUse(d);
  const items = [
    { k:'uncontrolledHtn', t:'Hipertensão não controlada (PAS > 160 mmHg)', p:1, on:!!hb.uncontrolledHtn },
    { k:'renal', t:'Função renal alterada (diálise, transplante ou Cr ≥ 2,26 mg/dL)', p:1, on:!!hb.renal || cr >= 2.26, auto: cr >= 2.26 ? `Creatinina: ${cr} mg/dL` : '' },
    { k:'liver', t:'Função hepática alterada (cirrose; bilirrubina > 2× e AST/ALT > 3× o LSN)', p:1, on:!!hb.liver },
    { t:'AVC prévio', p:1, on:!!rf.previousStroke, src:'Fatores de risco' },
    { k:'bleeding', t:'Sangramento prévio ou predisposição', p:1, on:!!hb.bleeding },
    { k:'labileInr', t:'INR lábil (em uso de varfarina)', p:1, on:!!hb.labileInr },
    { t:'Idoso (> 65 anos)', p:1, on:age > 65, src: age ? `Idade: ${age} anos` : 'Idade não informada' },
    { k:'drugs', t:'Antiplaquetário ou AINE em uso', p:1, on:!!hb.drugs || drugs.length > 0, auto: drugs.length ? `Na sacola: ${drugs.join(', ')}` : '' },
    { k:'alcohol', t:'Álcool (≥ 8 doses/semana)', p:1, on:!!hb.alcohol },
  ];
  const score = items.reduce((s,i)=>s + (i.on ? i.p : 0), 0);
  return { score, items, level: score >= 3 ? 'alto' : score === 2 ? 'moderado' : 'baixo' };
}
/* Mantém os valores salvos (usados no relatório) iguais ao cálculo */
function syncScores(d){
  if (!d || !d.cvProfile) return;
  d.cvProfile.cha2ds2vasc = cha2ds2vascScore(d).score;
  d.cvProfile.hasBled = hasBledScore(d).score;
}
function scoreCardsHTML(d){
  const c = cha2ds2vascScore(d), h = hasBledScore(d);
  const LV = { baixo:['emerald','Baixo risco'], intermediario:['yellow','Risco intermediário'], moderado:['yellow','Risco moderado'], alto:['red','Alto risco'] };
  const chaMsg = { baixo:'Anticoagulação geralmente não indicada.', intermediario:'Considerar anticoagulação oral.', alto:'Anticoagulação oral geralmente indicada — avaliar com o prescritor.' }[c.level];
  const hbMsg = { baixo:'Baixo risco de sangramento.', moderado:'Corrigir os fatores modificáveis.', alto:'Não contraindica anticoagular, mas exige corrigir fatores modificáveis e monitorar de perto.' }[h.level];
  const row = (i, ctrl) => `<li class="sc-row ${i.on ? 'on' : ''}">
      ${ctrl || `<span class="sc-ck">${i.on ? '✓' : ''}</span>`}
      <span class="sc-t">${i.t}${(i.auto || i.src) ? `<em>${escapeHtml(i.auto || i.src)}</em>` : ''}</span>
      <span class="sc-p">+${i.p}</span></li>`;
  const hbCtrl = i => i.k ? `<input type="checkbox" class="sc-in" data-hb="${i.k}" ${i.on ? 'checked' : ''} ${i.auto ? 'disabled title="Detectado automaticamente"' : ''}/>` : '';
  return `<div class="grid grid-2" style="gap:16px">
    <div class="score-card">
      <div class="sc-head">
        <div><label style="margin:0">CHA₂DS₂-VASc ${infoTip('CHA₂DS₂-VASc — risco de AVC na FA','Escore de risco de AVC/tromboembolismo na fibrilação atrial (0 a 9), calculado a partir dos fatores de risco, da idade e do sexo. Anticoagulação geralmente indicada com ≥ 2 (homens) ou ≥ 3 (mulheres); considerar com 1 (homens) ou 2 (mulheres).')}</label>
          <div class="small muted">Calculado automaticamente</div></div>
        <div class="sc-num">${c.score}<span>/9</span></div>
      </div>
      <div class="sc-level"><span class="badge ${LV[c.level][0]}">${LV[c.level][1]}</span><span class="small">${chaMsg}</span></div>
      ${!d.cvProfile.riskFactors.af ? `<div class="small muted" style="margin-top:6px">Escore aplicável à fibrilação atrial — FA não marcada.</div>` : ''}
      ${c.missing ? `<div class="small" style="color:var(--amber);margin-top:6px">⚠ Preencha idade e sexo (Etapa 1) para o cálculo completo.</div>` : ''}
      <ul class="sc-list">${c.items.map(i=>row(i)).join('')}</ul>
    </div>
    <div class="score-card">
      <div class="sc-head">
        <div><label style="margin:0">HAS-BLED ${infoTip('HAS-BLED — risco de sangramento','Escore de risco de hemorragia em anticoagulados (0 a 9). AVC, idade, creatinina e antiplaquetário/AINE vêm dos dados da avaliação; marque nas caixas os demais critérios. ≥ 3 = alto risco: não contraindica anticoagular, mas exige cautela e correção dos fatores modificáveis.')}</label>
          <div class="small muted">Calculado automaticamente + itens marcados</div></div>
        <div class="sc-num">${h.score}<span>/9</span></div>
      </div>
      <div class="sc-level"><span class="badge ${LV[h.level][0]}">${LV[h.level][1]}</span><span class="small">${hbMsg}</span></div>
      <ul class="sc-list">${h.items.map(i=>row(i, hbCtrl(i))).join('')}</ul>
    </div>
  </div>`;
}
function refreshScores(){
  const el = document.getElementById('cv-scores');
  if (!el || !wizardState.data) return;
  el.innerHTML = scoreCardsHTML(wizardState.data);
  bindScoreInputs();
}

      const cv = wizardState.data.cvProfile;
