/* Entrada rápida de medidas: slider (arrastar) + campo numérico (exato), sincronizados.
   Não usa data-bind/drawStep — atualiza os valores derivados no lugar para o arraste ficar fluido. */
function numSlider(label, path, key, value, opts){
  const min=opts.min, max=opts.max, step=opts.step||1, unit=opts.unit||'';
  const v = (value===''||value===null||value===undefined) ? '' : value;
  const sliderVal = (v===''?min:v);
  return `<div class="numf" data-nf="${key}">
    <div class="numf-top">
      <label>${label}</label>
      <span class="numf-val ${v===''?'empty':''}" id="nfval-${key}" data-u="${unit}">${v===''?'—':v}${v===''?'':(unit?`<span class="u">${unit}</span>`:'')}</span>
    </div>
    <div class="numf-row">
      <input type="range" id="nfr-${key}" min="${min}" max="${max}" step="${step}" value="${sliderVal}" oninput="anthroSet('${path}','${key}',this.value)">
      <input type="number" class="numf-num" id="nfn-${key}" min="${min}" max="${max}" step="${step}" value="${v}" oninput="anthroSet('${path}','${key}',this.value)" placeholder="—">
    </div>
    <div class="numf-scale"><span>${min}</span><span>${max}${unit?' '+unit:''}</span></div>
  </div>`;
}
window.anthroSet = function(path, key, raw){
  const v = raw===''?0:Number(raw);
  setByPath(path, v);
  persist();
  const r=document.getElementById('nfr-'+key), n=document.getElementById('nfn-'+key), b=document.getElementById('nfval-'+key), ae=document.activeElement;
  if (r && r!==ae) r.value = (raw===''? min0(r) : v);
  if (n && n!==ae) n.value = (raw===''? '' : v);
  if (b){ const u=b.getAttribute('data-u')||''; if(raw===''){ b.classList.add('empty'); b.innerHTML='—'; } else { b.classList.remove('empty'); b.innerHTML = v + (u?`<span class="u">${u}</span>`:''); } }
  updateAnthroReadouts();
  const foot=document.querySelector('.wizard aside .foot');
  if (foot && wizardState.savedAt) foot.innerHTML = `Salvo às ${wizardState.savedAt.toLocaleTimeString('pt-BR')}<br>Ctrl+S para salvar`;
};
function min0(el){ return el.getAttribute('min')||0; }
function updateAnthroReadouts(){
  const a=wizardState.data.anthropometric;
  const imcEl=document.getElementById('imc-out');
  if(imcEl){ const i=imc(a.weight,a.height); imcEl.value = i? (i+' — '+imcLabel(i)) : '-'; }
  const warn=document.getElementById('egfr-warn');
  if(warn){ warn.innerHTML = (a.egfr>0 && a.egfr<60) ? `<div class="alert warn" style="margin-top:10px"><div>⚠</div><div><div class="t">Atenção</div>TFG &lt; 60 indica insuficiência renal. Ajustes de dose podem ser necessários.</div></div>` : ''; }
}

function bindStep(step){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const path = el.getAttribute('data-bind');
      let v = el.type==='checkbox'?el.checked:(el.type==='number'?(el.value===''?0:Number(el.value)):el.value);
      setByPath(path, v);
      persist();
      const foot = document.querySelector('.wizard aside .foot');
      if (foot && wizardState.savedAt) foot.innerHTML = `Salvo às ${wizardState.savedAt.toLocaleTimeString('pt-BR')}<br>Ctrl+S para salvar`;
      if (path==='anthropometric.weight'||path==='anthropometric.height'||path==='anthropometric.egfr'){ drawStep(step); }
      if (path==='anthropometric.age'||path==='labs.creatinine') refreshScores();
    });
  });
  document.querySelectorAll('[data-rf]').forEach(el=>{
    el.addEventListener('change', ()=>{
      wizardState.data.cvProfile.riskFactors[el.getAttribute('data-rf')] = el.checked;
      persist();
      refreshScores();
    });
  });
  bindScoreInputs();
  document.querySelectorAll('[data-med]').forEach(el=>{
    const handler = ()=>{
      const id = el.getAttribute('data-med'), key = el.getAttribute('data-key');
      const med = wizardState.data.medications.find(m=>m.id===id);
      if (!med) return;
      med[key] = el.type==='checkbox'?el.checked:el.value;
      if (key==='drugId'){
        if (med.type==='ssri') med.name = SSRI_BY_ID[el.value]?.name || "";
        if (med.type==='cv') med.name = CV_BY_ID[el.value]?.name || "";
      }
      if (key==='type'){ med.drugId=""; med.name=""; }
      persist();
      if (key==='type' || key==='drugId') drawStep(3);
    };
    el.addEventListener('change', handler);
    if (el.tagName!=='SELECT' && el.type!=='checkbox') el.addEventListener('input', handler);
  });
  document.querySelectorAll('[data-medlink]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const mid = el.getAttribute('data-medlink'), pid = el.getAttribute('data-prob');
      const m = wizardState.data.medications.find(x=>x.id===mid);
      if (!m) return;
      m.linkedProblemIds = m.linkedProblemIds||[];
      if (el.checked){ if (!m.linkedProblemIds.includes(pid)) m.linkedProblemIds.push(pid); }
      else { m.linkedProblemIds = m.linkedProblemIds.filter(x=>x!==pid); }
      persist();
    });
  });
  document.querySelectorAll('[data-prob]').forEach(el=>{
    const handler = ()=>{
      const id = el.getAttribute('data-prob'), key = el.getAttribute('data-key');
      const p = wizardState.data.healthProblems.find(x=>x.id===id); if(!p) return;
      p[key] = el.value; persist();
    };
    el.addEventListener('change', handler);
    if (el.tagName!=='SELECT') el.addEventListener('input', handler);
  });
  document.querySelectorAll('[data-prm]').forEach(el=>{
    const handler = ()=>{
      const id = el.getAttribute('data-prm'), key = el.getAttribute('data-key');
      const p = wizardState.data.prms.find(x=>x.id===id); if (!p) return;
      p[key] = el.type==='checkbox'?el.checked:el.value;
      p.classification = classifyPRM(p);
      persist();
    };
    el.addEventListener('change', handler);
    if (el.tagName!=='SELECT' && el.type!=='checkbox') el.addEventListener('input', handler);
  });
  document.querySelectorAll('[data-visit]').forEach(el=>{
    const handler = ()=>{
      const id = el.getAttribute('data-visit'), key = el.getAttribute('data-key');
      const v = wizardState.data.followUpVisits.find(x=>x.id===id); if (!v) return;
      v[key] = el.value; persist();
    };
    el.addEventListener('change', handler);
    el.addEventListener('input', handler);
  });
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('change', ()=>{
      wizardState.data.followUp.actions[el.getAttribute('data-act')] = el.checked;
      persist();
    });
  });
  /* Carta ao médico: qualquer edição manual congela a auto-regeneração */
  const letterArea = document.getElementById('doctorLetterArea');
  if (letterArea){
    letterArea.addEventListener('input', ()=>{
      wizardState.data.intervention.doctorLetter = letterArea.value;
      if (!wizardState.data.intervention.letterEdited){
        wizardState.data.intervention.letterEdited = true;
        /* atualiza o cabeçalho (badge automática → editada) sem perder o cursor */
        const badge = document.querySelector('.card-t .badge');
        if (badge){ badge.className = 'badge amber'; badge.style.verticalAlign='middle'; badge.textContent = '✏ editada'; }
      }
      persist();
    });
  }
}

/* Keyboard shortcuts */
window.addEventListener('keydown', e=>{
  if (!wizardState.data) return;
  if (e.ctrlKey && e.key.toLowerCase()==='s'){ e.preventDefault(); persist(); toast('Rascunho salvo'); }
  if (e.ctrlKey && e.key==='ArrowRight') goStep(wizardState.step+1);
  if (e.ctrlKey && e.key==='ArrowLeft') goStep(wizardState.step-1);
});

window.exportData = function(){
  const data = JSON.stringify(getAssessments(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `farmacompanha-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Backup exportado');
};
window.importData = function(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = e=>{
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const arr = JSON.parse(ev.target.result);
        if (!Array.isArray(arr)) throw new Error("formato inválido");
        if (!confirm(`Importar ${arr.length} avaliação(ões)? Os registros existentes serão preservados.`)) return;
        const all = getAssessments();
        const ids = new Set(all.map(a=>a.id));
        arr.forEach(a=>{ if (!ids.has(a.id)) all.push(migrate(a)); });
        localStorage.setItem(KEY, JSON.stringify(all));
        toast('Importação concluída'); render();
      }catch(err){ alert('Arquivo inválido: '+err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};

  setSegment(0);

  // ---------------- Layout responsivo ----------------
  let W = 1, H = 1, halfW = 1, halfH = 1, mobile = false, fit = 1;
  function layout(){
    W = hero.clientWidth || 1; H = hero.clientHeight || 1;
    renderer.setSize(W, H, false);
    camera.aspect = W/H; camera.updateProjectionMatrix();
    halfH = Math.tan(THREE.MathUtils.degToRad(FOV/2))*CAM_Z; halfW = halfH*camera.aspect;
    mobile = camera.aspect < .95;
    // cabe entre a barra do topo e a legenda (formas têm até ~3,4 unidades de meia altura)
    fit = mobile ? Math.min(halfW*.62, halfH*.27)/2.9 : Math.min(halfH*.5, halfW*.4)/2.9;
    uniforms.uPx.value = renderer.getPixelRatio();
  }
  const ro = new ResizeObserver(layout); ro.observe(hero);
  layout();

  // ---------------- Mouse / toque ----------------
  const ndc = new THREE.Vector2(), ndcS = new THREE.Vector2(), ZERO2 = new THREE.Vector2(), raycaster = new THREE.Raycaster();
  const zPlane = new THREE.Plane(V(0, 0, 1), 0), hitP = V(0, 0, 0);
  let inside = false, burst = 0;
  function onMove(e){
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
    inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  function onLeave(){ inside = false; }
  function onDown(e){
    if (e.target === canvas) burst = 1;
  }
  window.addEventListener('pointermove', onMove, { passive:true });
  hero.addEventListener('pointerleave', onLeave);
  canvas.addEventListener('pointerdown', onDown);

  // ---------------- Loop (pausa fora da tela / aba oculta) ----------------
  let visible = true, running = false, raf = 0, last = 0, t = 0, disposed = false;
  const visIO = new IntersectionObserver(([e])=>{ visible = e.isIntersecting; start(); }, { threshold:0 });
  visIO.observe(hero);
  function onVis(){ start(); }
  document.addEventListener('visibilitychange', onVis);

  // ---------------- Sequência automática em loop ----------------
  // cada forma fica parada HOLD s e depois se transforma na próxima em MORPH s;
  // a chegada do ligante ao receptor (transição pareada) é mais lenta
  const HOLD = 2.6, MORPH = 1.9, MORPH_PAIRED = 2.8;
  let seqI = 0, seqT = 0;

  function tick(now){
    if (disposed) return;
    if (!visible || document.hidden){ running = false; return; }
    const dt = Math.min((now - last)/1000, 1/20); last = now; t += dt;
    uniforms.uTime.value = t;

    if (motion){
      seqT += dt;
      const dur = SHAPES[seqI].paired ? MORPH_PAIRED : MORPH;
      if (seqT >= HOLD + dur){ seqT -= HOLD + dur; seqI = (seqI + 1) % NS; }
    }
    setSegment(seqI);
    uniforms.uMix.value = motion ? smooth(0, 1, (seqT - HOLD)/(SHAPES[seqI].paired ? MORPH_PAIRED : MORPH)) : 0;

    // desktop: ao lado do texto da capa | celular: acima do texto
    if (mobile) stage.position.set(0, halfH*.44, 0);
    else stage.position.set(halfW*.45, 0, 0);
    stage.scale.setScalar(fit);

    // a forma gira devagar e inclina seguindo o mouse
    ndcS.lerp(inside ? ndc : ZERO2, Math.min(1, dt*4));
    points.rotation.y = t*.22*motion + ndcS.x*.6;
    points.rotation.x = -ndcS.y*.3;

    // posição do cursor no espaço da câmera (para afastar as partículas)
    camera.updateMatrixWorld();
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(zPlane, hitP)) uniforms.uMouse.value.copy(hitP).applyMatrix4(camera.matrixWorldInverse);
    uniforms.uMouseOn.value += ((inside ? 1 : 0) - uniforms.uMouseOn.value)*Math.min(1, dt*6);

    // clique: dispersa e volta
    burst *= Math.exp(-2.6*dt);
    uniforms.uBurst.value = burst*burst;

    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  function start(){
    if (disposed || running || !visible || document.hidden) return;
    running = true; last = performance.now();
    raf = requestAnimationFrame(tick);
  }
  start();

  return function dispose(){
    disposed = true; running = false;
    cancelAnimationFrame(raf);
    ro.disconnect(); visIO.disconnect();
    window.removeEventListener('pointermove', onMove);
    hero.removeEventListener('pointerleave', onLeave);
    canvas.removeEventListener('pointerdown', onDown);
    document.removeEventListener('visibilitychange', onVis);
    geo.dispose(); pmat.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
  };
}

/* =====================================================================
   TRIAGEM DE RISCO — Betabloqueadores (β1-seletivos e não seletivos) × ISRS
   Regras ILUSTRATIVAS para demonstrar o fluxo de triagem. Validar cada
   conduta contra fontes oficiais (CPIC/PharmGKB, bula, Micromedex/Lexicomp).
   Não substitui o julgamento do farmacêutico.
   ===================================================================== */
const TRIAGE_BB = [
  // sel = β1-seletivo? | sub2d6 = substrato de CYP2D6 | renal | lipo (metab. hepático) | qt
  { id:"propranolol", nome:"Propranolol", sel:false, sub2d6:true,  renal:false, lipo:true,  qt:false },
  { id:"nadolol",     nome:"Nadolol",     sel:false, sub2d6:false, renal:true,  lipo:false, qt:false },
  { id:"pindolol",    nome:"Pindolol",    sel:false, sub2d6:false, renal:false, lipo:false, qt:false },
  { id:"sotalol",     nome:"Sotalol",     sel:false, sub2d6:false, renal:true,  lipo:false, qt:true  },
  { id:"carvedilol",  nome:"Carvedilol",  sel:false, sub2d6:true,  renal:false, lipo:true,  qt:false },
  { id:"labetalol",   nome:"Labetalol",   sel:false, sub2d6:false, renal:false, lipo:true,  qt:false },
  { id:"timolol",     nome:"Timolol",     sel:false, sub2d6:true,  renal:false, lipo:false, qt:false },
  { id:"atenolol",    nome:"Atenolol",    sel:true,  sub2d6:false, renal:true,  lipo:false, qt:false },
  { id:"metoprolol",  nome:"Metoprolol",  sel:true,  sub2d6:true,  renal:false, lipo:true,  qt:false },
  { id:"bisoprolol",  nome:"Bisoprolol",  sel:true,  sub2d6:false, renal:false, lipo:false, qt:false },
  { id:"nebivolol",   nome:"Nebivolol",   sel:true,  sub2d6:true,  renal:false, lipo:true,  qt:false },
  { id:"betaxolol",   nome:"Betaxolol",   sel:true,  sub2d6:false, renal:false, lipo:false, qt:false },
  { id:"acebutolol",  nome:"Acebutolol",  sel:true,  sub2d6:false, renal:true,  lipo:false, qt:false },
];
const TRIAGE_ISRS = [
  { id:"fluoxetina",   nome:"Fluoxetina" },
  { id:"paroxetina",   nome:"Paroxetina" },
  { id:"sertralina",   nome:"Sertralina" },
  { id:"citalopram",   nome:"Citalopram" },
  { id:"escitalopram", nome:"Escitalopram" },
  { id:"fluvoxamina",  nome:"Fluvoxamina" },
];
const TBB_BY_ID = Object.fromEntries(TRIAGE_BB.map(d=>[d.id,d]));
const TISRS_BY_ID = Object.fromEntries(TRIAGE_ISRS.map(d=>[d.id,d]));
const ISRS_FORTE_2D6 = ["paroxetina","fluoxetina"];
const ISRS_QT_IDS    = ["citalopram","escitalopram"];
const ISRS_2C19_IDS  = ["citalopram","escitalopram","sertralina"];
function triageNome(id){ return (TBB_BY_ID[id]||TISRS_BY_ID[id]||{}).nome || id; }

let triageState = {
  gestante:false, asmaDpoc:false, diabetes:false,
  funcaoRenal:"desconhecida", funcaoHepatica:"desconhecida",
  meds:[], cyp2d6:"desconhecido", cyp2c19:"desconhecido"
};

function tHas(id){ return triageState.meds.includes(id); }
function tSome(ids){ return ids.filter(id=>tHas(id)); }
function tListar(ids){ return ids.map(triageNome).join(", "); }
function tBBsel(){ return TRIAGE_BB.filter(b=>tHas(b.id)); }

function runTriagem(){
  const S = triageState;
  const A = [];
  const add = (nivel,categoria,titulo,detalhe,conduta,fonte)=>A.push({nivel,categoria,titulo,detalhe,conduta,fonte});
  const bbSel = tBBsel();
  const sub2d6 = bbSel.filter(b=>b.sub2d6).map(b=>b.id);
  const naoSel = bbSel.filter(b=>!b.sel).map(b=>b.id);
  const renalBB = bbSel.filter(b=>b.renal).map(b=>b.id);
  const lipoBB = bbSel.filter(b=>b.lipo).map(b=>b.id);

  // 1. Interação CYP2D6: ISRS inibidor forte + betabloqueador substrato
  const isrsF = tSome(ISRS_FORTE_2D6);
  if (isrsF.length && sub2d6.length){
    const grave = sub2d6.includes("metoprolol");
    add(grave?"alto":"moderado","Interação",
      "ISRS inibidor de CYP2D6 + betabloqueador substrato",
      `${tListar(isrsF)} inibe(m) fortemente o CYP2D6 e aumenta(m) a exposição a ${tListar(sub2d6)}` + (grave?" (metoprolol é especialmente sensível), com risco de bradicardia e hipotensão.":", com risco de bradicardia/hipotensão."),
      "Monitorar FC e PA. Considerar betabloqueador não dependente de CYP2D6 (ex.: bisoprolol, atenolol) ou ISRS com menor inibição (ex.: sertralina em dose baixa, citalopram/escitalopram). Alinhar com o prescritor.",
      "Inibição de CYP2D6 por ISRS sobre betabloqueadores substrato");
  }
  // 2. PGx CYP2D6 reduzido + betabloqueador substrato
  if (sub2d6.length && (S.cyp2d6==="pobre"||S.cyp2d6==="intermediario")){
    add("moderado","Farmacogenômica",
      "Betabloqueador substrato de CYP2D6 em metabolizador reduzido",
      `Fenótipo CYP2D6 ${S.cyp2d6} eleva a exposição a ${tListar(sub2d6)}, aumentando o risco de bradicardia/hipotensão.`,
      "Recomendar início com dose menor e titulação cautelosa, com monitorização de FC e PA.",
      "CYP2D6 (fenótipo) × betabloqueadores substrato");
  }
  // 3. PGx CYP2D6 ultrarrápido
  if (sub2d6.length && S.cyp2d6==="ultrarrapido"){
    add("baixo","Farmacogenômica",
      "Betabloqueador substrato de CYP2D6 em metabolizador ultrarrápido",
      `Metabolismo ultrarrápido pode reduzir a exposição a ${tListar(sub2d6)} e o controle de FC/PA.`,
      "Avaliar resposta clínica (FC/PA); se controle insuficiente, discutir ajuste com o prescritor.",
      "CYP2D6 (fenótipo) × betabloqueadores substrato");
  }
  // 4. QT: sotalol + ISRS prolongador de QT
  const isrsQT = tSome(ISRS_QT_IDS);
  if (tHas("sotalol") && isrsQT.length){
    add("alto","Interação",
      "Sotalol + ISRS prolongador de QT",
      `Sotalol (classe III) com ${tListar(isrsQT)} soma o risco de prolongamento de QT e torsades de pointes.`,
      "Evitar a combinação sempre que possível. Se mantida, avaliar ECG/QTc, eletrólitos e considerar ISRS alternativo — contatar prescritor.",
      "Prolongamento aditivo do intervalo QT");
  }
  // 5. PGx CYP2C19 + ISRS substrato
  const isrs2c19 = tSome(ISRS_2C19_IDS);
  if (isrs2c19.length && (S.cyp2c19==="pobre"||S.cyp2c19==="intermediario")){
    const comSotalol = tHas("sotalol") && isrsQT.length>0;
    add(comSotalol?"alto":"moderado","Farmacogenômica",
      "ISRS substrato de CYP2C19 em metabolizador reduzido",
      `Fenótipo CYP2C19 ${S.cyp2c19} eleva a exposição a ${tListar(isrs2c19)}` + (comSotalol?" — com sotalol associado, o risco de QT prolongado é ainda maior.":" (citalopram/escitalopram: atenção ao QT)."),
      "Considerar redução da dose máxima conforme diretriz e monitorar. Se houver risco de QT, avaliar ECG/QTc.",
      "CPIC — ISRS/CYP2C19 (citalopram/escitalopram/sertralina)");
  }
  // 6. CYP1A2: fluvoxamina + propranolol
  if (tHas("fluvoxamina") && tHas("propranolol")){
    add("moderado","Interação",
      "Fluvoxamina + Propranolol",
      "Fluvoxamina inibe potentemente o CYP1A2 e aumenta a concentração de propranolol, com risco de bradicardia/hipotensão.",
      "Monitorar FC/PA; considerar ajuste de dose do propranolol ou ISRS alternativo com o prescritor.",
      "Inibição de CYP1A2 pela fluvoxamina sobre o propranolol");
  }
  // 7. Duplicidade: dois betabloqueadores
  if (bbSel.length>=2){
    add("alto","Duplicidade",
      "Dois betabloqueadores simultâneos",
      `${tListar(bbSel.map(b=>b.id))}: efeito aditivo com risco de bradicardia, hipotensão e bloqueio AV.`,
      "Manter apenas um betabloqueador, salvo indicação específica documentada. Confirmar com o prescritor.",
      "Duplicidade terapêutica (dois betabloqueadores)");
  }
  // 8. Duplicidade: dois ISRS
  const isrsSel = tSome(TRIAGE_ISRS.map(i=>i.id));
  if (isrsSel.length>=2){
    add("moderado","Duplicidade",
      "Dois ISRS simultâneos",
      `${tListar(isrsSel)}: sem benefício aditivo e com risco de síndrome serotoninérgica.`,
      "Manter apenas um ISRS. Em troca, atentar ao washout (a fluoxetina tem meia-vida longa). Alinhar com o prescritor.",
      "Duplicidade terapêutica (dois ISRS) / risco serotoninérgico");
  }
  // 9. Não seletivo + asma/DPOC
  if (naoSel.length && S.asmaDpoc){
    add("alto","Contraindicação",
      "Betabloqueador não seletivo em asma/DPOC",
      `${tListar(naoSel)} pode(m) causar broncoespasmo por bloqueio β2.`,
      "Preferir β1-seletivo em dose baixa quando imprescindível; evitar não seletivos. Sinalizar ao prescritor.",
      "Betabloqueador não seletivo em asma/DPOC");
  }
  // 10. Não seletivo + diabetes
  if (naoSel.length && S.diabetes){
    add("moderado","Interação",
      "Betabloqueador não seletivo em diabetes",
      `${tListar(naoSel)} pode(m) mascarar sinais de hipoglicemia e retardar a recuperação glicêmica.`,
      "Preferir β1-seletivo; orientar o paciente sobre sinais de hipoglicemia (a sudorese costuma ser preservada).",
      "Betabloqueador não seletivo em diabetes");
  }
  // 11. Dose × órgão: eliminação renal
  if (renalBB.length && (S.funcaoRenal==="moderada"||S.funcaoRenal==="grave")){
    const sotalolGrave = renalBB.includes("sotalol") && S.funcaoRenal==="grave";
    add(sotalolGrave?"alto":"moderado","Dose × órgão",
      "Betabloqueador de eliminação renal em disfunção renal",
      `${tListar(renalBB)} acumula(m) na disfunção renal, com risco de bradicardia` + (renalBB.includes("sotalol")?" e prolongamento de QT (sotalol).":"."),
      "Recomendar ajuste de dose/intervalo pela função renal; para sotalol, monitorar QTc. Confirmar com o prescritor.",
      "Betabloqueadores de eliminação renal (atenolol/nadolol/sotalol)");
  }
  // 12. Dose × órgão: metabolismo hepático
  if (lipoBB.length && S.funcaoHepatica==="alterada"){
    add("moderado","Dose × órgão",
      "Betabloqueador lipofílico em disfunção hepática",
      `${tListar(lipoBB)} tem metabolismo hepático; a disfunção eleva a exposição e o risco de bradicardia/hipotensão.`,
      "Iniciar com dose menor e titular com cautela, monitorando FC/PA.",
      "Betabloqueadores lipofílicos de metabolismo hepático");
  }
  // 13. Contraindicação: atenolol na gestação
  if (S.gestante && tHas("atenolol")){
    add("moderado","Contraindicação",
      "Atenolol em gestante",
      "Atenolol associa-se a restrição de crescimento fetal, sobretudo no início da gestação.",
      "Discutir alternativa com o prescritor (ex.: labetalol/metildopa, conforme indicação).",
      "Atenolol na gestação");
  }

  const ord = { alto:3, moderado:2, baixo:1 };
  A.sort((a,b)=>ord[b.nivel]-ord[a.nivel]);
  return A;
}

const TRIAGE_NIVEL = {
  alto:     { badge:"red",   card:"grave",     label:"Risco alto",     alert:"danger" },
  moderado: { badge:"yellow",card:"moderado",  label:"Risco moderado", alert:"warn"   },
  baixo:    { badge:"cyan",  card:"leve",       label:"Risco baixo",    alert:"info"   },
};

function renderTriagem(){
  const alerts = runTriagem();
  const cont = { alto:0, moderado:0, baixo:0 };
  alerts.forEach(a=>cont[a.nivel]++);
  const nivelGeral = cont.alto? "alto" : cont.moderado? "moderado" : cont.baixo? "baixo" : "sem";
  const geral = nivelGeral==="sem"
    ? { label:"Sem alertas", alert:"ok" }
    : { label:TRIAGE_NIVEL[nivelGeral].label, alert:TRIAGE_NIVEL[nivelGeral].alert };

  const medBtn = (d, on)=>`<button type="button" onclick="triageToggleMed('${d.id}')"
      class="btn ${on?'primary':'outline'}" style="justify-content:flex-start;padding:9px 12px;${on?'':'border-style:dashed'}">
      ${on?'✓ ':''}${escapeHtml(d.nome)}</button>`;

  const selField = (key, label, opts)=>`<div>
      <label>${label}</label>
      <select onchange="triageSet('${key}', this.value)">

      </select></div>`;

  const naoSelBBs = TRIAGE_BB.filter(b=>!b.sel);
  const selBBs = TRIAGE_BB.filter(b=>b.sel);

  const alertsHtml = alerts.length===0
    ? `<div class="empty" style="padding:32px"><div class="icon">🛡️</div><h3>Nenhum alerta com os dados informados</h3><p>Selecione os medicamentos e o perfil do paciente. Registre também as fontes consultadas.</p></div>`
    : alerts.map(a=>{

        return `<div class="int-card ${nv.card}">
          <div class="h">
            <div>
              <div class="t" style="font-size:16px">${escapeHtml(a.titulo)}</div>
              <div class="d">${escapeHtml(a.categoria)}</div>
            </div>
            <span class="badge ${nv.badge}" style="text-transform:uppercase">${a.nivel}</span>
          </div>
          <div class="b">
            <div class="row"><h5>Achado</h5><p>${escapeHtml(a.detalhe)}</p></div>
            <div class="reco"><h5>Conduta sugerida</h5><p>${escapeHtml(a.conduta)}</p></div>
            <p class="small muted" style="margin-top:10px">Fonte: ${escapeHtml(a.fonte)}</p>

      }).join('');

  $app.innerHTML = `

      </div>
      <div class="alert warn" style="margin-bottom:20px">
        <span>⚠️</span>
        <div><span class="t">Protótipo com regras ilustrativas.</span> Não substitui o julgamento clínico nem as fontes oficiais (CPIC/PharmGKB, bula, Micromedex/Lexicomp). Valide cada conduta antes de qualquer decisão real.</div>
      </div>

      <div class="grid grid-2" style="align-items:start">
        <!-- Coluna de entrada -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-h"><div class="card-t">Perfil do paciente</div></div>
            <div class="card-c" style="display:flex;flex-direction:column;gap:14px">
              <div class="grid grid-2" style="gap:12px">
                ${selField("funcaoRenal","Função renal (ClCr)", [["desconhecida","Desconhecida"],["normal","Normal"],["leve","Leve"],["moderada","Moderada"],["grave","Grave"]])}
                ${selField("funcaoHepatica","Função hepática", [["desconhecida","Desconhecida"],["normal","Normal"],["alterada","Alterada"]])}
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:18px;padding-top:2px">
                <label class="chk"><input type="checkbox" ${triageState.asmaDpoc?'checked':''} onchange="triageChk('asmaDpoc')"> Asma / DPOC</label>
                <label class="chk"><input type="checkbox" ${triageState.diabetes?'checked':''} onchange="triageChk('diabetes')"> Diabetes</label>
                <label class="chk"><input type="checkbox" ${triageState.gestante?'checked':''} onchange="triageChk('gestante')"> Gestante</label>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-h"><div class="card-t">Betabloqueadores em uso</div><p class="card-d">Não seletivos e β1-seletivos</p></div>
            <div class="card-c">
              <h5 class="sub-h" style="margin-top:0">Não seletivos</h5>

              <h5 class="sub-h">β1-seletivos</h5>

          <div class="alert ${geral.alert}" style="align-items:center;justify-content:space-between">
            <div><div class="small muted" style="text-transform:uppercase;letter-spacing:.06em">Estratificação geral</div><div style="font-size:22px;font-weight:700;margin-top:2px">${geral.label}</div></div>
            <div style="display:flex;gap:6px">
              <span class="badge red">${cont.alto} alto</span>
              <span class="badge yellow">${cont.moderado} moderado</span>
              <span class="badge cyan">${cont.baixo} baixo</span>
            </div>
          </div>
          <div class="sec-head" style="margin:0"><h2 style="font-size:16px">Alertas & conduta</h2>
            ${alerts.length?`<button class="btn sm" onclick="triageCopy()">⧉ Copiar registro</button>`:''}
          </div>
          ${alertsHtml}
        </div>
      </div>
      ${footer()}
    </div>`;
}
window.triageToggleMed = function(id){
  const i = triageState.meds.indexOf(id);
  if (i>=0) triageState.meds.splice(i,1); else triageState.meds.push(id);
  renderTriagem();
};
window.triageSet = function(key,val){ triageState[key]=val; renderTriagem(); };
window.triageChk = function(key){ triageState[key]=!triageState[key]; renderTriagem(); };
window.triageReset = function(){
  triageState = { gestante:false, asmaDpoc:false, diabetes:false, funcaoRenal:"desconhecida", funcaoHepatica:"desconhecida", meds:[], cyp2d6:"desconhecido", cyp2c19:"desconhecido" };
  renderTriagem();
};
window.triageCopy = function(){
  const alerts = runTriagem();
  const cont = { alto:0, moderado:0, baixo:0 }; alerts.forEach(a=>cont[a.nivel]++);
  const nivelGeral = cont.alto?"Risco alto":cont.moderado?"Risco moderado":cont.baixo?"Risco baixo":"Sem alertas";
  const linhas = [
    "TRIAGEM DE RISCO — FARMACOMPANHA (Betabloqueadores × ISRS) — protótipo",
    "Data/hora: " + new Date().toLocaleString('pt-BR'),
    "Nível geral: " + nivelGeral,
    "Perfil: Renal " + triageState.funcaoRenal + " | Hepática " + triageState.funcaoHepatica + " | Asma/DPOC " + (triageState.asmaDpoc?"sim":"não") + " | Diabetes " + (triageState.diabetes?"sim":"não") + " | Gestante " + (triageState.gestante?"sim":"não"),
    "CYP2D6: " + triageState.cyp2d6 + " | CYP2C19: " + triageState.cyp2c19,
    "Medicamentos: " + (triageState.meds.length? triageState.meds.map(triageNome).join(", ") : "—"),
    "",
    "Alertas (" + alerts.length + "):",
    ...alerts.map(a=>`- [${a.nivel.toUpperCase()}] ${a.titulo} — Conduta: ${a.conduta} (Fonte: ${a.fonte})`)
  ];
  const txt = linhas.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast("Registro copiado")); }
  else { toast("Não foi possível copiar"); }
};

function render(){
  if (landingCleanup){ landingCleanup(); landingCleanup = null; }
  if (!location.hash) return renderLanding();
  const hash = location.hash.replace(/^#/, '') || '/';
  if (!hash.startsWith('/avaliacao/')) wizardState = { step:1, data:null, savedAt:null };
  if (hash === '/' || hash === '') return renderHome();
  if (hash === '/triagem') return renderTriagem();
  if (hash === '/biblioteca') return renderLibrary();
  if (hash === '/matriz') return renderMatrix();
  const m1 = hash.match(/^\/avaliacao\/(.+)$/);
  if (m1) return renderAssessment(m1[1]);
  const m2 = hash.match(/^\/relatorio\/(.+)$/);
  if (m2) return renderReport(m2[1]);
  $app.innerHTML = `<div class="container"><h1>Página não encontrada</h1><a href="#/" class="btn">Voltar ao início</a></div>`;
}

window.addEventListener('hashchange', render);
seedIfEmpty();
render();
</script>
</body>
</html>
